# يولّد صوت درس التجربة (قانون أوم) بالصوت الليبي المجاني من Edge، ثم يحفظه في pilot/ohm
name: pilot-voice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pilot-src/**', '.github/workflows/pilot-voice.yml']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install --quiet edge-tts
      - run: python pilot-src/tools/tts.py pilot-src/ohm/ch01/narration.ar.json pilot/ohm/ch01/audio/ar
      - run: |
          git config user.name "livebook-bot"
          git config user.email "livebook-bot@users.noreply.github.com"
          git add pilot/ohm/ch01/audio pilot-src
          git diff --cached --quiet || git commit -m "صوت درس قانون أوم (تجربة)"
          git push
