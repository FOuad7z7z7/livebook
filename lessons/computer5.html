  S.innerHTML=`<h2>🔷 ارسم بطاقة تهنئة</h2><div class=task>أدرج 5 أشكال مختلفة على الصفحة، ثم أضف نصًا فنيًا</div>${W({tabs:['الصفحة الرئيسية','إدراج'],edit:false,rib:Object.keys(SH).map(s=>`<button data-s="${s}">${s}</button>`).join('')+'<span class=sep></span><button data-w=1>🅰️ نص فني</button>',html:'<div id=cv style="position:relative;height:170px"></div>'})}`;
  S.querySelector('.tabs span:nth-child(3)').classList.add('on');S.querySelector('.tabs span:nth-child(2)').classList.remove('on');
  S.querySelectorAll('.rib button[data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s;$('cv').insertAdjacentHTML('beforeend',`<span style="position:absolute;left:${rnd(5,85)}%;top:${rnd(5,70)}%;font-size:${rnd(28,48)}px;animation:pop .3s">${s}</span>`);FX.pop();if(!SH[s]){SH[s]=1;n++;good()}});
  S.querySelector('[data-w]').onclick=()=>{if(n<5)return OWL('أدرج الأشكال الخمسة أولًا 🔷 ('+n+'/5)');$('cv').insertAdjacentHTML('beforeend','<div style="position:absolute;inset:auto 0 6px 0;text-align:center;font:900 2rem Cairo;background:linear-gradient(90deg,#e03131,#f59f00,#2f9e44,#1c7ed6);-webkit-background-clip:text;color:transparent">عيد سعيد 🎉</div>');FX.win();confetti();finishAct(p,k,p.acts.length);OWL('🎉 بطاقتك جاهزة! هكذا نستعمل تبويب «إدراج»')};
  OWL('اضغط أزرار الأشكال لتدرجها في الصفحة 🔷')},
 /* ---------- الجداول ---------- */
 table(p,k){rounds(p,k,'▦ أدرج جدولًا',5,()=>{const c=rnd(2,6),r=rnd(2,5);let pc=0,pr=0;
  return{html:`<div class=task>أدرج جدولًا من <b>${c}</b> أعمدة و<b>${r}</b> صفوف (مرّر/المس المربعات)</div><div style="text-align:center"><div class=tgrid id=tg>${Array.from({length:48},(_,i)=>`<i data-c=${i%8+1} data-r=${Math.floor(i/8)+1}></i>`).join('')}</div><div style="font:900 1.3rem Cairo;margin:6px;direction:ltr" id=tl>0 × 0</div></div>`,ans:'x',txt:'إدراج ← جدول ← اختر عدد الأعمدة والصفوف ▦',
   init(Q,pv){const hl=(cc,rr)=>{Q.querySelectorAll('#tg i').forEach(e=>e.classList.toggle('on',+e.dataset.c<=cc&&+e.dataset.r<=rr));$('tl').textContent=cc+' × '+rr};
    Q.querySelectorAll('#tg i').forEach(e=>{e.onmouseenter=()=>hl(+e.dataset.c,+e.dataset.r);e.onclick=()=>{pc=+e.dataset.c;pr=+e.dataset.r;hl(pc,pr);if(pc===c&&pr===r)pv('x',e);else pv('no',e)}})}}})},
 sched(p,k){const S=$('stg');const need=[['الأحد','عربي'],['الاثنين','رياضيات'],['الثلاثاء','حاسوب']];
  S.innerHTML=`<h2>📅 جدول الحصص</h2><div class=task>اكتب في الجدول: الأحد ← عربي، الاثنين ← رياضيات، الثلاثاء ← حاسوب</div>${W({html:`<table><tr style="background:#d0ebff;font-weight:900"><td>اليوم</td><td>الحصة الأولى</td></tr>${need.map(n=>`<tr><td>${n[0]}</td><td contenteditable=true data-a="${n[1]}"></td></tr>`).join('')}</table>`,edit:false,rib:'<button>▦ جدول</button>'})}`;
  S.querySelectorAll('td[data-a]').forEach(td=>td.oninput=()=>{const ok=[...S.querySelectorAll('td[data-a]')].every(x=>x.innerText.trim()===x.dataset.a);td.style.background=td.innerText.trim()===td.dataset.a?'#d3f9d8':'';if(ok){good();FX.win();confetti();finishAct(p,k,p.acts.length);OWL('🎉 جدولك جاهز! هكذا نكتب داخل خلايا الجدول')}});
  OWL('المس الخلية الفارغة واكتب فيها ✍️')},
 tfmt(p,k){const S=$('stg');let rows=2,cols=2,shade=false,bold=false;const goal='3 صفوف · 3 أعمدة · تظليل الصف الأول · خط عريض للعنوان';
  const draw=()=>{S.innerHTML=`<h2>🎨 نسّق الجدول</h2><div class=task>المطلوب: ${goal}</div>${W({tabs:['الصفحة الرئيسية','تصميم الجدول','تخطيط'],edit:false,rib:'<button data-a=r>➕ صف</button><button data-a=c>➕ عمود</button><button data-a=dr>➖ صف</button><button data-a=dc>➖ عمود</button><span class=sep></span><button data-a=s>🎨 تظليل الصف الأول</button><button data-a=b><b>B</b> عنوان عريض</button>',
    html:`<table>${Array.from({length:rows},(_,r)=>`<tr style="${r===0&&shade?'background:#ffd8a8':''}">${Array.from({length:cols},(_,c)=>`<td style="${r===0&&bold?'font-weight:900':''}">${r===0?['الاسم','الصف','الهواية'][c]||'':''}</td>`).join('')}</tr>`).join('')}</table>`})}`;
   S.querySelectorAll('.rib button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;FX.pop();if(a==='r')rows=Math.min(5,rows+1);if(a==='c')cols=Math.min(5,cols+1);if(a==='dr')rows=Math.max(1,rows-1);if(a==='dc')cols=Math.max(1,cols-1);if(a==='s')shade=!shade;if(a==='b')bold=!bold;draw();
    if(rows===3&&cols===3&&shade&&bold){good();FX.win();confetti();finishAct(p,k,p.acts.length);OWL('🎉 جدول منسّق ومرتّب! أنت محترف Word 🏆')}})};
  draw();OWL('استخدم أزرار تبويب «تخطيط» و«تصميم الجدول» لتنسيق الجدول 🎨')},
 /* ---------- تحدٍّ ---------- */
 quiz(p,k,o){rounds(p,k,'🏆 '+(o.t||'التحدي'),o.n||8,i=>{const q=o.Q[i%o.Q.length];return{html:`<div class=circ style="font:900 1.2rem Cairo">${q[0]}</div>`,opts:shuf(q[2]),fs:'1.05rem',oc:'#e8590c',ans:q[1],txt:'اختر الإجابة الصحيحة 👇'}})}
};
function c5Page(p){$('app').innerHTML=topBar()+`<div class=title><h1>${p.icon} <bdi>${p.t}</bdi></h1>${p.sub?'<p>'+p.sub+'</p>':''}</div>`+steps(p,p.acts,0)+`<div class=stage id=stg></div>`;
 const fns=p.acts.map(a=>()=>G5[a[3]](p,a[0],a[4]||{}));bindSteps(p,p.acts,fns);fns[0]()}
window.XT=Object.assign(window.XT||{},{c5:c5Page});

route();</script></body></html>
