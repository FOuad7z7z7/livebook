<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>English 1 – الصف الأول – الكتاب الحي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;direction:rtl;color:#2b2d42;min-height:100vh;
 background:radial-gradient(circle at 20% 10%,#fff6d6 0,transparent 40%),radial-gradient(circle at 90% 30%,#d7f5ff 0,transparent 45%),linear-gradient(180deg,#e9f7ff,#fff4fb);overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky i{position:absolute;font-style:normal;opacity:.55;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-30vw)}}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:10px 12px 120px}
.top{display:flex;align-items:center;gap:8px}
.top .home{border:0;background:#fff;border-radius:18px;padding:8px 14px;font:inherit;font-weight:900;font-size:1.1rem;box-shadow:0 4px 0 #d0d7e2;cursor:pointer}
.stars{margin-inline-start:auto;background:#fff;border-radius:18px;padding:6px 14px;font-weight:900;font-size:1.2rem;box-shadow:0 4px 0 #ffd43b}
/* البومة */
#owl{position:fixed;bottom:10px;left:10px;z-index:20;display:flex;align-items:flex-end;gap:6px;pointer-events:none;max-width:92vw}
#owl .o{width:84px;height:84px;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));pointer-events:auto;cursor:pointer}
#owl .o.talk{animation:talk .25s ease-in-out infinite alternate}
#owl .b{background:#fff;border-radius:22px 22px 22px 4px;padding:10px 14px;font-weight:800;font-size:1.05rem;box-shadow:0 6px 16px rgba(0,0,0,.12);max-width:300px;transform-origin:bottom left;animation:pop .3s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes talk{to{transform:scale(1.08) rotate(4deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
/* الخريطة */
.title{text-align:center;margin:8px 0 4px}.title h1{margin:0;font-size:2rem;color:#7048e8;text-shadow:0 3px 0 #fff}.title p{margin:0;font-weight:700;color:#868e96}
.map{position:relative;margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.map svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.stop{position:relative;z-index:1;margin:0 auto 14px;text-align:center;cursor:pointer;animation:pop .4s backwards}
.house{width:96px;height:96px;font-size:3rem!important;margin:0 auto;border-radius:36px;display:grid;place-items:center;font-size:3.6rem;font-weight:900;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.15),inset 0 -8px 0 rgba(0,0,0,.08);transition:transform .15s;position:relative}
.stop:active .house{transform:scale(.92)}
.house .st{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:1.05rem;background:#fff;border-radius:12px;padding:0 6px;white-space:nowrap}
.stop b{display:block;margin-top:18px;font-size:1.05rem}
.album{background:#fff;border-radius:24px;padding:12px;margin-top:16px;box-shadow:0 6px 0 #e9ecef}
.album h3{margin:0 0 6px}.album .s{display:inline-grid;place-items:center;width:52px;height:52px;margin:3px;border-radius:50%;background:#f1f3f5;font-size:1.8rem;filter:grayscale(1);opacity:.35}
.album .s.on{filter:none;opacity:1;background:#fff3bf;animation:pop .4s}
/* صفحة الحرف */
.hero{position:relative;text-align:center}
canvas.lt{width:min(320px,80vw);height:auto;display:block;margin:0 auto;cursor:pointer}
.steps{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.steps button{border:0;border-radius:22px;padding:10px 12px;min-width:70px;font:inherit;font-weight:900;font-size:1rem;background:#fff;box-shadow:0 5px 0 #dee2e6;cursor:pointer;position:relative}
.steps button .e{display:block;font-size:1.8rem}
.steps button.on{background:#7048e8;color:#fff;box-shadow:0 5px 0 #4c2fb0}
.steps button.done::after{content:"⭐";position:absolute;top:-10px;left:-6px;font-size:1.3rem}
.stage{background:#fff;border-radius:30px;padding:14px;box-shadow:0 8px 0 #e9ecef;min-height:360px;position:relative;overflow:hidden}
.stage h2{margin:0 0 8px;text-align:center;font-size:1.3rem}
canvas.play{width:100%;display:block;border-radius:22px;touch-action:none}
.cards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.card{border:0;border-radius:26px;min-width:96px;padding:12px 10px;font:inherit;font-weight:900;font-size:2.6rem;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s}
.card small{display:block;font-size:.9rem;font-weight:800;opacity:.95}
.card:active{transform:scale(.92)}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pic{border:0;background:#f8f9fa;border-radius:24px;padding:10px 4px;font:inherit;cursor:pointer;box-shadow:0 5px 0 #e9ecef;transition:transform .15s}
.pic .em{font-size:3.2rem;display:block}.pic b{font-size:1.1rem}
.pic.ok{background:#d3f9d8;box-shadow:0 5px 0 #8ce99a;transform:scale(1.05)}.pic.no{animation:shk .4s;background:#ffe3e3}
@keyframes shk{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.big{display:block;width:100%;border:0;border-radius:24px;padding:14px;font:inherit;font-weight:900;font-size:1.25rem;color:#fff;background:linear-gradient(135deg,#ff922b,#f76707);box-shadow:0 6px 0 #d9480f;cursor:pointer;margin-top:12px}
.big.g{background:linear-gradient(135deg,#51cf66,#2f9e44);box-shadow:0 6px 0 #2b8a3e}
.prog{display:flex;justify-content:center;gap:5px;margin:6px 0}.prog i{width:14px;height:14px;border-radius:50%;background:#e9ecef}.prog i.on{background:#ffd43b;box-shadow:0 0 0 3px #fff3bf}
.cf{position:fixed;top:-50px;font-size:2rem;pointer-events:none;z-index:50;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.reward{position:fixed;inset:0;z-index:40;background:rgba(43,45,66,.55);display:grid;place-items:center}
.reward div{background:#fff;border-radius:36px;padding:24px 30px;text-align:center;animation:pop .4s}
.reward .s{font-size:6rem;animation:bob 1.2s infinite}.reward h2{margin:6px 0}
.word{font-size:2.6rem;font-weight:900;letter-spacing:2px;text-align:center;margin:6px 0}
.word .gap{display:inline-block;min-width:56px;border-bottom:5px dashed #ffa94d;color:#ffa94d}
