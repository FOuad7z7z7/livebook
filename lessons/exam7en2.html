<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امتحان – الكتاب الحي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--ink:#1f2a44;--or:#f08c2e;--bg:#f4f6fb;--ok:#2f9e44;--no:#e03131}
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);direction:rtl}
.en{direction:ltr;unicode-bidi:isolate;font-family:"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:820px;margin:0 auto;padding:12px 12px 80px}
.hero{background:linear-gradient(160deg,#fff,#fff4e6);border-radius:24px;padding:26px 18px;text-align:center;box-shadow:0 8px 30px rgba(31,42,68,.08);margin-top:10px}
.hero .ic{font-size:3.4rem}.hero h1{margin:6px 0 2px;font-size:1.5rem}.hero .sub{color:#868e96;font-weight:700}
.facts{display:flex;gap:10px;justify-content:center;margin:18px 0}.facts div{background:#fff;border-radius:16px;padding:10px 14px;min-width:90px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.facts b{display:block;font-size:1.4rem;color:var(--or)}.facts span{font-size:.8rem;color:#868e96}
.tips{background:#fff;border-radius:16px;padding:12px;text-align:right;line-height:2;font-size:.95rem;margin:10px 0}
.best{margin:6px 0 10px;font-weight:800;color:#2b8a3e}.note{margin-top:12px;font-size:.8rem;color:#868e96}
.btn{border:0;border-radius:16px;padding:14px 22px;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
.btn.go{background:linear-gradient(135deg,#f08c2e,#e8590c);color:#fff;width:100%;box-shadow:0 6px 18px rgba(232,89,12,.3);margin-top:8px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid #dee2e6}
.bar{position:sticky;top:0;z-index:5;background:rgba(244,246,251,.96);backdrop-filter:blur(6px);display:flex;align-items:center;gap:10px;padding:10px 4px;font-weight:800;font-size:.85rem}
.bar .pg{flex:1;height:10px;background:#dee2e6;border-radius:8px;overflow:hidden}.bar .pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f08c2e,#2f9e44);transition:width .3s}
.sheet{background:#fff;border-radius:22px;padding:14px;box-shadow:0 8px 30px rgba(31,42,68,.07)}
.paper-h{text-align:center;border-bottom:2px dashed #dee2e6;padding-bottom:10px;margin-bottom:10px}.paper-h b{display:block;font-size:1.15rem}.paper-h span{color:#868e96;font-size:.9rem}
.sec{margin:18px 0}.sec-h{background:#1f2a44;color:#fff;border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.sec-h .en{font-weight:800;flex:1 1 100%}.sec-h small{opacity:.85}.sec-h em{font-style:normal;color:#ffd8a8;font-weight:800}
.q{border:2px solid #edf0f5;border-radius:16px;padding:10px 12px;margin:10px 0;transition:.2s}
.qt{display:flex;align-items:center;gap:8px;direction:ltr;font-size:1.05rem;font-weight:700}.qt .n{background:#fff4e6;color:#e8590c;border-radius:10px;min-width:30px;height:30px;display:grid;place-items:center;font-size:.9rem}.qt .en{flex:1}
.say{cursor:pointer;background:#e7f5ff;border-radius:10px;padding:4px 8px;font-size:1rem}.say.on{background:#ffd43b}
.ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;direction:ltr}.ops button{flex:1 1 30%;min-width:120px;border:2px solid #dee2e6;background:#fff;border-radius:14px;padding:10px;font:inherit;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.ops button i{font-style:normal;background:#f1f3f5;border-radius:8px;width:24px;height:24px;display:grid;place-items:center;font-size:.8rem;color:#868e96}
.ops.tf button{flex:1 1 40%;font-size:1rem}
.ops button.sel{border-color:#f08c2e;background:#fff4e6}.ops button.ok{border-color:var(--ok);background:#ebfbee;color:#2b8a3e}.ops button.no{border-color:var(--no);background:#fff5f5;color:#c92a2a}
.q.good{border-color:#b2f2bb}.q.bad{border-color:#ffc9c9;background:#fffafa}
.ex{font-size:.92rem;margin-top:6px;line-height:1.7}.ex b{color:#2b8a3e}.ex div{color:#495057}
.gift .giftn{margin-top:8px;background:#fff9db;border-radius:12px;padding:8px;font-size:.9rem}
.tbl{border:2px solid #edf0f5;border-radius:16px;overflow:hidden;margin-top:10px;direction:ltr}.tbl-h,.tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;padding:8px;align-items:center}
.tbl-h{background:#f8f9fa;font-weight:800;font-size:.9rem}.tr{border-top:1px solid #edf0f5}.tr.good{background:#f4fdf5}.tr.bad{background:#fff8f8}
.cell0{font-weight:800}.tr input,.tr select{width:100%;border:2px solid #dee2e6;border-radius:10px;padding:9px;font:inherit;font-size:1rem;direction:ltr;background:#fff}
.tr input.ok,.tr select.ok{border-color:var(--ok);background:#ebfbee}.tr input.no,.tr select.no{border-color:var(--no);background:#fff5f5}
.cell{display:flex;flex-direction:column;gap:3px}.fix{color:#2b8a3e;font-weight:800;font-size:.9rem}
.hint{font-size:.85rem;color:#868e96;margin:6px 4px}
.result{background:linear-gradient(160deg,#fff,#f3f0ff);border-radius:20px;padding:18px;text-align:center;margin:6px 0 14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.result .big{font-size:2.6rem;font-weight:900}.result .big small{font-size:1.2rem;color:#868e96}.result .lv{font-weight:800;font-size:1.1rem}
.secs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.secs div{background:#fff;border-radius:12px;padding:6px 12px;font-size:.85rem;display:flex;gap:6px}
.tm2{color:#868e96;font-size:.85rem}.rb{display:flex;gap:8px;margin-top:10px}.rb .btn{flex:1;font-size:1rem;padding:12px}
.cf{position:fixed;inset:0;pointer-events:none;z-index:9}
</style></head><body><div id="app"></div>
<script>/* ============ محرك الامتحانات – الكتاب الحي ============ */
const $=id=>document.getElementById(id);
const EW=s=>s;
function hsh(s){let h=0x811c9dc5;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return ('0000000'+h.toString(16)).slice(-8)}
let CUR=null;
function tts(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function SAY(t){try{if(CUR)CUR.pause()}catch(e){}let fb=0;const a=new Audio(EX.audio+hsh(t)+'.mp3');CUR=a;const fall=()=>{if(fb)return;fb=1;tts(t)};a.onerror=fall;const p=a.play();if(p&&p.catch)p.catch(fall)}
const enw=t=>t.replace(/([A-Za-z][A-Za-z0-9 ,.'’→\-]*[A-Za-z0-9.?])/g,'<span class="en">$1</span>');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const SP=t=>'<span class="say" data-say="'+t.replace(/"/g,'&quot;')+'">🔊</span>';
document.addEventListener('click',e=>{const s=e.target.closest('.say');if(!s)return;e.stopPropagation();SAY(s.dataset.say);s.classList.add('on');setTimeout(()=>s.classList.remove('on'),900)},true);
const send=(t,q)=>{try{parent.postMessage(q?{lbt:t,qq:q}:{lbt:t},'*')}catch(e){}};
const norm=s=>String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
let ANS={},T0=0,TI=null,DONE=false,ITEMS=[];

function intro(){const tot=EX.sections.reduce((a,s)=>a+s.marks,0);EX.total=tot;
 const best=(()=>{try{return JSON.parse(localStorage.getItem('exbest_'+EX.id)||'null')}catch(e){return null}})();
 $('app').innerHTML='<div class="hero"><div class="ic">📝</div><h1>'+EX.title+'</h1><div class="sub">'+EX.sub+'</div>'+
 '<div class="facts"><div><b>'+tot+'</b><span>درجة</span></div><div><b>'+EX.sections.length+'</b><span>أسئلة رئيسية</span></div><div><b>'+EX.time+'</b><span>زمن الامتحان الأصلي</span></div></div>'+
 (best?'<div class="best">🏅 أفضل درجة لك: <b>'+best.s+' / '+tot+'</b></div>':'')+
 '<div class="tips">✍️ أجب عن كل الأسئلة، ثم اضغط <b>«سلّم الامتحان»</b> في الأسفل.<br>🔊 اضغط على السماعة لتسمع الجملة بالإنجليزي.<br>✅ بعد التسليم ترى درجتك، وكل خطأ مع الإجابة الصحيحة وشرحها.</div>'+
 '<button class="btn go" id="start">ابدأ الامتحان ⏱️</button>'+(EX.note?'<div class="note">'+EX.note+'</div>':'')+'</div>';
 $('start').onclick=start}

function start(){DONE=false;ANS={};ITEMS=[];T0=Date.now();window.scrollTo(0,0);
 let h='<div class="bar"><div class="pg"><i id="pgI"></i></div><span id="pgT"></span><span id="tm">⏱️ 0:00</span></div><div class="sheet"><div class="paper-h"><b>'+EX.title+'</b><span>'+EX.sub+'</span></div>';
 EX.sections.forEach((s,si)=>{h+='<div class="sec"><div class="sec-h"><span class="en">'+esc(s.title)+'</span><small>'+s.ar+'</small><em>('+s.marks+' درجة)</em></div>';
  if(s.type==='tf')s.items.forEach((it,i)=>{const k=si+'_'+i;ITEMS.push({k,s,it,t:'tf'});h+='<div class="q" id="q'+k+'"><div class="qt"><span class="n">'+(i+1)+'</span><span class="en">'+esc(it.q)+'</span>'+SP(it.q)+'</div><div class="ops tf"><button data-k="'+k+'" data-v="T">✅ True</button><button data-k="'+k+'" data-v="F">❌ False</button></div><div class="ex"></div></div>'});
  if(s.type==='mcq')s.items.forEach((it,i)=>{const k=si+'_'+i;ITEMS.push({k,s,it,t:'mcq'});
   if(it.gift){h+='<div class="q gift" id="q'+k+'"><div class="qt"><span class="n">'+(i+1)+'</span><span class="en">'+esc(it.q)+'</span></div><div class="giftn">🎁 أُلغي هذا السؤال في الامتحان الأصلي، ودرجته محسوبة لك تلقائيًا.</div></div>';return}
   h+='<div class="q" id="q'+k+'"><div class="qt"><span class="n">'+(i+1)+'</span><span class="en">'+esc(it.q)+'</span>'+SP(it.say||it.q.replace(/_+|\.{3,}/g,'…'))+'</div><div class="ops">'+it.o.map((o,j)=>'<button data-k="'+k+'" data-v="'+j+'"><i>'+'abc'[j]+'</i><span class="en">'+esc(o)+'</span></button>').join('')+'</div><div class="ex"></div></div>'});
  if(s.type==='table'){h+='<div class="tbl"><div class="tbl-h">'+s.cols.map(c=>'<span class="en">'+esc(c)+'</span>').join('')+'</div>';
   s.rows.forEach((r,i)=>{const k=si+'_'+i;ITEMS.push({k,s,it:r,t:'table'});h+='<div class="tr" id="q'+k+'"><span class="en cell0">'+esc(r.p)+'</span>'+r.a.map((a,j)=>'<div class="cell">'+(s.bank?'<select data-k="'+k+'" data-j="'+j+'"><option value="">— اختر —</option>'+s.bank.map(b=>'<option>'+esc(b)+'</option>').join('')+'</select>':'<input data-k="'+k+'" data-j="'+j+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب هنا">')+'</div>').join('')+'</div>'});
   h+='</div>'+(s.hint?'<div class="hint">'+s.hint+'</div>':'')}
  h+='</div>'});
 h+='<button class="btn go" id="sub">سلّم الامتحان ✔️</button></div>';$('app').innerHTML=h;
 document.querySelectorAll('.ops button').forEach(b=>b.onclick=()=>{if(DONE)return;const k=b.dataset.k;ANS[k]=b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));prog()});
 document.querySelectorAll('.tr input,.tr select').forEach(x=>x.oninput=x.onchange=()=>{const k=x.dataset.k;ANS[k]=ANS[k]||[];ANS[k][+x.dataset.j]=x.value;prog()});
 $('sub').onclick=()=>{const left=ITEMS.filter(x=>!x.it.gift&&!answered(x)).length;if(left&&!confirm('بقي '+left+' سؤالًا بدون إجابة. هل تريد التسليم الآن؟'))return;grade()};
 clearInterval(TI);TI=setInterval(()=>{const s=Math.floor((Date.now()-T0)/1000);$('tm').textContent='⏱️ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);prog()}

function answered(x){const a=ANS[x.k];if(x.t==='table')return a&&x.it.a.every((_,j)=>a[j]&&String(a[j]).trim());return a!==undefined}
function prog(){const n=ITEMS.filter(x=>!x.it.gift).length,d=ITEMS.filter(x=>!x.it.gift&&answered(x)).length;$('pgI').style.width=(d/n*100)+'%';$('pgT').textContent='أجبت '+d+' من '+n}

function grade(){DONE=true;clearInterval(TI);const secs=Math.floor((Date.now()-T0)/1000);let total=0;const per=EX.sections.map(()=>0),out=[];
 ITEMS.forEach(x=>{const el=$('q'+x.k),a=ANS[x.k];let ok=false,right='';
  if(x.it.gift){ok=true}
  else if(x.t==='tf'){ok=a===x.it.a;right=x.it.a==='T'?'True':'False';el.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.dataset.v===x.it.a)b.classList.add('ok');else if(b.dataset.v===a)b.classList.add('no')})}
  else if(x.t==='mcq'){ok=+a===x.it.a;right=x.it.o[x.it.a];el.querySelectorAll('button').forEach(b=>{b.disabled=true;if(+b.dataset.v===x.it.a)b.classList.add('ok');else if(b.dataset.v===a)b.classList.add('no')})}
  else{ok=x.it.a.every((c,j)=>a&&norm(a[j])===norm(c));right=x.it.a.join(' · ');el.querySelectorAll('input,select').forEach((f,j)=>{f.disabled=true;f.classList.add(norm(f.value)===norm(x.it.a[j])?'ok':'no');if(norm(f.value)!==norm(x.it.a[j])){const s=document.createElement('span');s.className='fix en';s.textContent='✔ '+x.it.a[j];f.parentElement.appendChild(s)}})}
  const w=x.s.type==='table'?x.s.marks/x.s.rows.length:x.s.marks/x.s.items.length;if(ok){total+=w;per[EX.sections.indexOf(x.s)]+=w}
  el.classList.add(ok?'good':'bad');
  if(x.t!=='table'&&!x.it.gift){const exd=el.querySelector('.ex');exd.innerHTML=(ok?'✅ صحيح':'❌ الإجابة الصحيحة: <b class="en">'+esc(right)+'</b>')+(x.it.ex?'<div>💡 '+enw(x.it.ex)+'</div>':'')}
  if(!x.it.gift)out.push([ok?'ok':'no',x]);
 });
 total=Math.round(total*10)/10;const pct=Math.round(total/EX.total*100);
 try{const b=JSON.parse(localStorage.getItem('exbest_'+EX.id)||'null');if(!b||total>b.s)localStorage.setItem('exbest_'+EX.id,JSON.stringify({s:total,t:Date.now()}))}catch(e){}
 const lv=pct>=90?['🏆','ممتاز!','#2f9e44']:pct>=75?['🌟','جيد جدًا','#1971c2']:pct>=65?['👍','جيد','#e8590c']:pct>=50?['🙂','مقبول، تحتاج مراجعة','#f08c2e']:['💪','تحتاج مراجعة أكثر، لا تستسلم!','#e03131'];
 const card=document.createElement('div');card.className='result';
 card.innerHTML='<div class="big" style="color:'+lv[2]+'">'+lv[0]+' '+total+' <small>/ '+EX.total+'</small></div><div class="lv" style="color:'+lv[2]+'">'+lv[1]+' · '+pct+'%</div><div class="secs">'+EX.sections.map((s,i)=>'<div><span class="en">'+esc(s.title.split(' ')[0])+'</span><b>'+Math.round(per[i]*10)/10+' / '+s.marks+'</b></div>').join('')+'</div><div class="tm2">⏱️ الوقت: '+Math.floor(secs/60)+' دقيقة</div><div class="rb"><button class="btn go" id="again">🔄 أعد الامتحان</button><button class="btn ghost" id="seeErr">👀 راجع أخطائي</button></div>';
 const sh=document.querySelector('.sheet');sh.insertBefore(card,sh.children[1]);$('sub').remove();window.scrollTo({top:0,behavior:'smooth'});
 $('again').onclick=()=>{intro();window.scrollTo(0,0)};$('seeErr').onclick=()=>{const f=document.querySelector('.bad');f&&f.scrollIntoView({behavior:'smooth',block:'center'})};
 if(pct>=75){try{confetti()}catch(e){}}
 // يُرسل للتطبيق ليظهر في تقرير ولي الأمر و«أخطائي»
 let i=0;const tick=()=>{if(i>=out.length)return;const [t,x]=out[i++];if(x.t==='mcq')send(t,{q:x.it.q,o:x.it.o,r:x.it.a,w:t==='ok'?x.it.a:+ANS[x.k]});else send(t);setTimeout(tick,320)};tick();
}
function confetti(){const c=document.createElement('canvas');c.className='cf';document.body.appendChild(c);const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*3,r:4+Math.random()*5,c:['#f08c2e','#2f9e44','#1971c2','#e03131','#fab005'][Math.floor(Math.random()*5)],a:Math.random()*6}));let f=0;const tk=()=>{x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.fillRect(p.x+Math.sin(p.a)*8,p.y,p.r,p.r*1.6)});if(++f<200)requestAnimationFrame(tk);else c.remove()};tk()}


const EX={id:'g7-en-t2-1',audio:'audio-x7/',
 title:'امتحان الإنجليزي – الصف السابع',sub:'نموذج امتحان نهاية الفصل الدراسي الثاني',time:'3 ساعات',
 note:'صحّحنا بعض الأخطاء في ورقة الإجابة الأصلية، وأصلحنا الأخطاء الإملائية في الأسئلة.',
 sections:[
 {type:'tf',title:'Q1: Which sentences are true? Which are false?',ar:'صواب أم خطأ',marks:12,items:[
  {q:EW("Nouns are the names of food, buildings, etc."),a:'T',ex:'الأسماء (Nouns) هي أسماء الأشياء: الطعام والمباني والأشخاص والأماكن.'},
  {q:EW("Australia is a very large country."),a:'T',ex:'أستراليا دولة كبيرة جدًا، بل قارة كاملة.'},
  {q:EW("Hasan have gone to London."),a:'F',ex:'مع المفرد (Hasan) نقول has: Hasan has gone to London.'},
  {q:EW("At home I am most helpful than my sister."),a:'F',ex:'مع than نستعمل صيغة المقارنة more: I am more helpful than my sister.'},
  {q:EW("France is a big city."),a:'F',ex:'فرنسا دولة (country) وليست مدينة.'},
  {q:EW("China are a very large country."),a:'F',ex:'China مفرد، فنقول: China is a very large country.'},
  {q:EW("The past participle of the verb ride is ridden."),a:'T',ex:'ride → rode → ridden. (ورقة الإجابة الأصلية كتبت خطأ، والصحيح صواب.)'},
  {q:EW("Beijing is the capital city of India."),a:'F',ex:'بكين عاصمة الصين. عاصمة الهند نيودلهي.'},
  {q:EW("Indonesia is the country of a hundred islands."),a:'F',ex:'إندونيسيا فيها آلاف الجزر، وليس مئة فقط.'},
  {q:EW("I will be wearing a T-shirt."),a:'T',ex:'جملة صحيحة في المستقبل المستمر: will be + ing.'},
  {q:EW("France is famous for its shops and restaurants."),a:'T',ex:'فرنسا مشهورة بمحلاتها ومطاعمها.'},
  {q:EW("Saw means noticed."),a:'T',ex:'saw (رأى) قريبة في المعنى من noticed (لاحظ).'}]},
 {type:'mcq',title:'Q2: Choose the correct answer',ar:'اختر الإجابة الصحيحة',marks:24,items:[
  {q:'The word "exhausted" means …',say:EW("The word exhausted means ..."),o:['very tired','very hungry','very rich'],a:0,ex:'exhausted = متعب جدًا.'},
  {q:'"Popular" means …',say:EW("Popular means ..."),o:['luckily','famous','screamed'],a:1,ex:'popular = مشهور ومحبوب.'},
  {q:'My mother … when she saw a mouse in the garden.',say:EW("My mother ... when she saw a mouse in the garden."),o:['starving','chased','screamed'],a:2,ex:'screamed = صرخت. رأت فأرًا فصرخت.'},
  {q:'The capital city of Australia is …',say:EW("The capital city of Australia is ..."),o:['Canberra','Beijing','Pretoria'],a:0,ex:'كانبرا عاصمة أستراليا (وليست سيدني).'},
  {q:'The weather of Indonesia is …',say:EW("The weather of Indonesia is ..."),o:['warm and hot','warm and wet','warm and dry'],a:1,ex:'إندونيسيا دافئة وممطرة: warm and wet.'},
  {q:'The past participle of the verb "eat" is …',say:EW("The past participle of the verb eat is ..."),o:['ate','eat','eaten'],a:2,ex:'eat → ate → eaten.'},
