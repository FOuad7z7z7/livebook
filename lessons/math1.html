body{margin:0;font-family:Cairo,Tahoma,sans-serif;direction:rtl;color:#2b2d42;min-height:100vh;

  [()=>{const a=rnd(2,6),b=rnd(1,4);return{e:'🎈',v:[a,b],ans:a+b,op:'+',txt:'مع سارة '+a+' بالونات، وأعطتها أمها '+b+'. كم صار معها؟',say:[T("مَعَ سَارَةَ بَالُونَاتٌ عَدَدُهَا"),NUM[a],T("وَأَعْطَتْهَا أُمُّهَا"),NUM[b],T("كَمْ صَارَ مَعَهَا؟")]}}],
  [()=>{const a=rnd(2,5),b=rnd(1,5);return{e:'🐟',v:[a,b],ans:a+b,op:'+',txt:'اصطاد علي '+a+' سمكات، ثم اصطاد '+b+'. كم سمكة اصطاد؟',say:[T("اِصْطَادَ عَلِيٌّ سَمَكَاتٍ عَدَدُهَا"),NUM[a],T("ثُمَّ اصْطَادَ"),NUM[b],T("كَمْ سَمَكَةً اصْطَادَ؟")]}}],
  [()=>{const a=rnd(4,10),b=rnd(1,a-1);return{e:'🍎',v:[a,b],ans:a-b,op:'-',txt:'في السلة '+a+' تفاحات، أكلنا '+b+'. كم بقي؟',say:[T("فِي السَّلَّةِ تُفَّاحَاتٌ عَدَدُهَا"),NUM[a],T("أَكَلْنَا مِنْهَا"),NUM[b],T("كَمْ بَقِيَ فِي السَّلَّةِ؟")]}}],
  [()=>{const a=rnd(4,10),b=rnd(1,a-1);return{e:'🚗',v:[a,b],ans:a-b,op:'-',txt:'في الموقف '+a+' سيارات، خرجت '+b+'. كم بقي؟',say:[T("فِي الْمَوْقِفِ سَيَّارَاتٌ عَدَدُهَا"),NUM[a],T("خَرَجَ مِنْهَا"),NUM[b],T("كَمْ سَيَّارَةً بَقِيَتْ؟")]}}]];
  rounds(p,k,'📖 مسائل قصصية',6,i=>{const set=o.op==='+'?ST_.slice(0,2):o.op==='-'?ST_.slice(2):ST_;const s=pick(set)[0]();
  return{html:`<div class=card style="background:#fff;color:#343a40;font-size:1.4rem;line-height:2;text-align:center;cursor:default;display:block;max-width:560px;margin:0 auto">📖 ${s.txt}<div style="font-size:2rem">${rep(s.e,s.v[0])} ${s.op==='+'?'➕ '+rep(s.e,s.v[1]):''}</div></div><div class=eq style="font-size:2.6rem">${s.v[0]} ${s.op} ${s.v[1]} = <span class=q>?</span></div>`,opts:optsN(s.ans,0,10),ans:s.ans,txt:'اسمع القصة… ثم احسب 📖',say:s.say,after:[NUM[s.v[0]],s.op==='+'?PLUS:MINUS,NUM[s.v[1]],EQ,NUM[s.ans]]}})},
 /* الأشكال */
 shape(p,k){rounds(p,k,'🔷 أين الشكل؟',8,()=>{const S4=shuf(SH),t=S4[0];
  return{html:`<div class=mrow>${S4.map((s,j)=>`<div class=mbox data-v="${s.n}">${svgS(s,SHC[j])}</div>`).join('')}</div>`,ans:t.n,txt:'المس <b>'+t.n+'</b> 👆',say:t.say,after:t.nm}})},
 real(p,k){rounds(p,k,'🍕 ما شكله؟',8,()=>{const t=pick(SH),e=pick(t.real);
  return{html:`<div style="text-align:center;font-size:6rem">${e}</div><div class=mrow>${shuf(SH).map((s,j)=>`<div class=mbox data-v="${s.n}">${svgS(s,SHC[j+1],70)}</div>`).join('')}</div>`,ans:t.n,txt:'هذا الشيء يشبه أيّ شكل؟ 🤔',say:T("هَذَا الشَّيْءُ يُشْبِهُ أَيَّ شَكْلٍ؟"),after:t.nm}})},
 pattern(p,k){const PT=[[0,1],[0,0,1],[0,1,1],[0,1,2]];rounds(p,k,'🔁 أكمل النمط',8,()=>{const pt=pick(PT),E=shuf(['🔴','🔵','🟡','🟢','⭐','🌙','🍎','🐟']).slice(0,3),L=pt.length*2+(Math.random()<.5?1:0),seq=Array.from({length:L},(_,i)=>E[pt[i%pt.length]]),ans=E[pt[L%pt.length]];
  return{html:`<div class=pat>${seq.map(e=>`<span>${e}</span>`).join('')}<span class=q>?</span></div>`,opts:shuf(E),ans,txt:'ماذا يأتي بعد؟ 🔁',say:T("مَاذَا يَأْتِي بَعْدُ فِي النَّمَطِ؟")}})},
 /* الترتيبية */
 race(p,k){rounds(p,k,'🏁 السباق الكبير',6,()=>{const A=shuf(ANI).slice(0,5),q=rnd(0,4);
  return{html:`<div class=race><div class=fin></div>${A.map((a,j)=>`<span class=runner data-v=${j} style="left:${88}%;top:${10+j*56}px">${a[0]}</span>`).join('')}</div><p style="text-align:center;font-weight:800;color:#868e96">🏁 خط النهاية على اليسار</p>`,ans:q,txt:'من وصل <b>'+ORW[q]+'</b>؟ 🏁',say:ORD[q],
   init(Q){const order=shuf([0,1,2,3,4]),R=order.map(j=>Q.querySelector(`[data-v="${j}"]`));R.forEach((r,pos)=>{r.dataset.v=pos;r.style.transition='left '+(1.2+pos*.5)+'s ease-out';setTimeout(()=>{r.style.left=(6+pos*12)+'%';setTimeout(()=>r.insertAdjacentHTML('beforeend','<b>'+(pos+1)+'</b>'),(1.2+pos*.5)*1000)},300)});FX.boing()},
   after:ORS[q]}})},
 /* حتى 20 */
 tens(p,k){rounds(p,k,'🔟 عشرة وآحاد: كم العدد؟',8,()=>{const n=rnd(10,20);
  return{html:`<div style="text-align:center">${tfr(Math.min(n,10),'🔴')}${tfr(n-10,'🔵')}</div>`,opts:optsN(n,10,20),ans:n,txt:'عشرة 🔴 و '+(n-10)+' 🔵… كم المجموع؟',say:HOWM,after:NUM[n]}})},
 seq(p,k,o){const mx=o.max||20;rounds(p,k,'🔢 العدد الناقص',8,()=>{const s=rnd(0,mx-4),m=rnd(1,3),L=[s,s+1,s+2,s+3,s+4];
  return{html:`<div class=pat style="font:900 2.6rem Cairo">${L.map((v,i)=>i===m?'<span class=q>?</span>':`<span style="background:#fff;border-radius:14px;padding:0 12px;border:3px solid #dee2e6">${v}</span>`).join('')}</div>`,opts:optsN(L[m],0,mx),ans:L[m],txt:'ما العدد الناقص؟ 🤔',say:T("مَا الْعَدَدُ النَّاقِصُ؟"),after:NUM[L[m]]}})},
 pv(p,k){rounds(p,k,'🧱 القيمة المكانية',8,i=>{const n=rnd(11,20),t=Math.floor(n/10),u=n%10,ask=i%2;
  return{html:`<div class=pv><div class=rod>${'<i></i>'.repeat(10)}</div>${t>1?`<div class=rod>${'<i></i>'.repeat(10)}</div>`:''}<div style="display:flex;flex-wrap:wrap;width:120px;gap:3px">${'<span class=one></span>'.repeat(u)}</div></div><div class=eq style="font-size:2.4rem">${ask?`عشرات: ${t} · آحاد: <span class=q>?</span>`:`العدد = <span class=q>?</span>`}</div>`,opts:ask?optsN(u,0,9):optsN(n,10,20),ans:ask?u:n,txt:ask?'كم <b>آحاد</b> في العدد '+n+'؟ (المكعبات البرتقالية)':'عمود العشرة 🟦 + المكعبات 🟧… كم العدد؟',say:ask?T("كَمْ آحَادًا فِي الْعَدَدِ؟"):HOWM}})},
 /* تحدي مختلط */
 mix(p,k){const L=['addEq','subEq','croc','seq'];let gi=0;const S=G;rounds(p,k,'🏆 التحدي الكبير',10,i=>{const t=i%4;if(t===0){const a=rnd(1,9),b=rnd(1,10-a);return{html:`<div class=eq>${a} + ${b} = <span class=q>?</span></div>`,opts:optsN(a+b,0,10),ans:a+b,txt:'احسب 🧠',say:[NUM[a],PLUS,NUM[b],EQ,T("كَمْ؟")]}}
  if(t===1){const a=rnd(3,10),b=rnd(1,a);return{html:`<div class=eq>${a} - ${b} = <span class=q>?</span></div>`,opts:optsN(a-b,0,10),ans:a-b,txt:'احسب 🧠',say:[NUM[a],MINUS,NUM[b],EQ,T("كَمْ؟")]}}
  if(t===2){let a=rnd(0,20),b=rnd(0,20);while(a===b)b=rnd(0,20);return{html:`<div class=mrow>${[a,b].map(v=>`<div class=mbox data-v=${v} style="font:900 3.4rem Cairo;color:#1c7ed6">${v}</div>`).join('')}</div>`,ans:Math.max(a,b),txt:'أيّهما <b>أكبر</b>؟ 🐊',say:T("أَيُّ الْعَدَدَيْنِ أَكْبَرُ؟")}}
  const n=rnd(1,10),e=pick(POOL);return{html:`<div class=mbox style="margin:0 auto;max-width:420px">${rep(e,n)}</div>`,opts:optsN(n,1,10),ans:n,txt:'كم عددها؟ 👀',say:HOWM}})}
};
function tfr(n,e,cross){const F=Math.max(1,Math.ceil(n/10));let o='';for(let f=0;f<F;f++)o+=`<div class=tf>${Array.from({length:10},(_,i)=>{const j=f*10+i;return`<i>${j<n?(cross&&j>=n-cross?'<span style="opacity:.3">'+e+'</span>':e):''}</i>`}).join('')}</div>`;return o}

route();</script></body></html>
