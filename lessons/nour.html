<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>كلّم الأستاذ نور – الكتاب الحي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;min-height:100vh;background:linear-gradient(#e3fafc,#fff9db);color:#212529;text-align:center}
.w{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:8px}.top a{color:#1971c2;font-weight:800;text-decoration:none}
h1{color:#1971c2;font-size:1.5rem;margin:8px 0 2px}
.sub{color:#495057;font-weight:700;margin:0 0 10px}
.av{width:170px;height:170px;margin:18px auto 8px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,#d0ebff);display:flex;align-items:center;justify-content:center;font-size:6rem;box-shadow:0 10px 30px rgba(25,113,194,.25);position:relative;transition:transform .2s}
.av::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:6px solid #4dabf7;opacity:0;transition:opacity .2s}
.av.talk{animation:bob .5s infinite alternate}.av.talk::after{opacity:.8;animation:ring 1s infinite}
.av.listen::after{opacity:.6;border-color:#40c057}
@keyframes bob{to{transform:scale(1.04)}}@keyframes ring{50%{inset:-18px;opacity:.3}}
.st{font-weight:900;font-size:1.1rem;min-height:1.6em;color:#1971c2}
.tm{font-weight:800;color:#868e96;min-height:1.4em}
.cap{background:#fff;border-radius:18px;padding:12px 14px;margin:12px 0;min-height:70px;box-shadow:0 6px 18px rgba(0,0,0,.07);line-height:1.9;font-weight:700;text-align:right;max-height:34vh;overflow:auto}
.cap .k{color:#2b8a3e}.cap .t{color:#1864ab}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
button{font-family:inherit;font-weight:900;font-size:1.15rem;border:0;border-radius:99px;padding:14px 26px;cursor:pointer;color:#fff}
#go{background:linear-gradient(135deg,#2f9e44,#40c057);font-size:1.3rem;padding:16px 34px;box-shadow:0 8px 20px rgba(47,158,68,.35)}
#end{background:#e03131;display:none}#mute{background:#495057;display:none}
.note{color:#868e96;font-size:.85rem;margin-top:16px;line-height:1.8}
.err{color:#c92a2a}
</style></head><body><div class="w">
<div class="top"><a href="#" id="back">→ رجوع للدرس</a></div>
<h1>📞 كلّم الأستاذ نور</h1>
<p class="sub" id="sub">تكلّم بصوتك، والأستاذ يسمعك ويشرحلك ويسألك</p>
<div class="av" id="av">🧑‍🏫</div>
<div class="st" id="st">جاهز</div>
<div class="tm" id="tm"></div>
<div class="cap" id="cap"><span style="color:#adb5bd">هنا يظهر كلامك وكلام الأستاذ…</span></div>
<div class="btns"><button id="go">🎙️ ابدأ المكالمة</button><button id="mute">🔇 كتم</button><button id="end">⏹ إنهاء</button></div>
<div class="note">نسخة تجريبية · تحتاج إنترنت جيد وسماعة أفضل · المكالمة حتى 5 دقائق</div>
</div>
<script>
const FN='https://jrhzqgapywgdblujyrns.supabase.co/functions/v1/nour';
const WSU='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained?access_token=';
const Q=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
let tok=null;try{tok=(JSON.parse(localStorage.getItem('livebook_v2'))||{}).tok}catch(e){}
let ctxT='';try{ctxT=sessionStorage.getItem('lb_nour_ctx')||''}catch(e){}
const LES={grade:Q.get('g')||'',subject:Q.get('s')||'',title:Q.get('t')||''};
if(LES.title)$('sub').textContent='📖 '+LES.title;else if(LES.subject)$('sub').textContent='📖 '+LES.subject;
let ws,mic,inCtx,outCtx,node,srcN,nextT=0,playing=new Set(),muted=false,live=false,timer,endAt,tIn='',tOut='',lastWho='';
function st(t,c){$('st').textContent=t;$('st').className='st'+(c?' '+c:'')}
function cap(who,txt){const c=$('cap');if(lastWho!==who||!c.lastChild||c.lastChild.nodeType!==1||!c.lastChild.dataset.w){const d=document.createElement('div');d.dataset.w=who;d.className=who;d.textContent=(who==='k'?'🧒 ':'🧑‍🏫 ');c.appendChild(d);if(c.firstChild&&c.firstChild.tagName==='SPAN')c.firstChild.remove();lastWho=who}c.lastChild.textContent+=txt;c.scrollTop=1e6}
function b64(buf){let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function play(b){const bin=atob(b),n=bin.length>>1,f=new Float32Array(n);for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;f[i]=v/32768}
 const ab=outCtx.createBuffer(1,n,24000);ab.getChannelData(0).set(f);const s=outCtx.createBufferSource();s.buffer=ab;s.connect(outCtx.destination);
 const t=Math.max(outCtx.currentTime+0.04,nextT);s.start(t);nextT=t+ab.duration;playing.add(s);$('av').className='av talk';
 s.onended=()=>{playing.delete(s);if(!playing.size&&live)$('av').className='av listen'}}
function stopPlay(){playing.forEach(s=>{try{s.stop()}catch(e){}});playing.clear();nextT=0}
const WK=`class P extends AudioWorkletProcessor{constructor(){super();this.b=new Int16Array(1600);this.i=0}process(I){const c=I[0]&&I[0][0];if(c){for(let k=0;k<c.length;k++){let v=Math.max(-1,Math.min(1,c[k]));this.b[this.i++]=v<0?v*32768:v*32767;if(this.i===1600){this.port.postMessage(this.b.buffer.slice(0));this.i=0}}}return true}}registerProcessor('p',P)`;
async function start(){
 if(!tok){st('لازم تدخل لحسابك في «الكتاب الحي» أول 🙂','err');return}
 $('go').disabled=true;st('نجهّز المكالمة…');
 try{inCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});outCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:24000});await inCtx.resume();await outCtx.resume()}catch(e){}
 try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}})}catch(e){st('لازم تسمح باستعمال الميكروفون 🎙️','err');$('go').disabled=false;return}
 let r;try{const x=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,...LES,ctx:ctxT})});r=await x.json()}catch(e){r={err:'net'}}
 if(!r.tok){const m={auth:'لازم تدخل لحسابك في «الكتاب الحي» أول 🙂',limit:'خلصت مكالمات اليوم 🌙 نرجعوا بكرة!',nokey:'الأستاذ مش جاهز بعد (المفتاح ناقص)',net:'مشكلة في الإنترنت، جرّب مرة ثانية',closed:'الأستاذ نور لسّه في التجربة، قريباً يكون متاح لك 🙂',gemini:'مشكلة في الاتصال بالأستاذ ('+(r.status||'')+')'};st(m[r.err]||('صار خطأ: '+r.err),'err');cleanup();return}
 ws=new WebSocket(WSU+encodeURIComponent(r.tok));
 ws.onopen=()=>{ws.send(JSON.stringify({setup:{model:'models/'+r.model,generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:r.voice}}}},systemInstruction:{parts:[{text:r.sys}]},inputAudioTranscription:{},outputAudioTranscription:{}}}))};
 ws.onmessage=async ev=>{let m;try{m=JSON.parse(typeof ev.data==='string'?ev.data:await ev.data.text())}catch(e){return}
  if(m.setupComplete){live=true;await startMic();st('الأستاذ معاك… تكلّم 🎙️');$('av').className='av listen';$('end').style.display='';$('mute').style.display='';$('go').style.display='none';
   endAt=Date.now()+r.mins*60e3;timer=setInterval(tick,500);ws.send(JSON.stringify({realtimeInput:{text:'السلام عليكم يا أستاذ'}}));return}
  const sc=m.serverContent;if(!sc)return;
  if(sc.interrupted)stopPlay();
  if(sc.modelTurn&&sc.modelTurn.parts)for(const p of sc.modelTurn.parts)if(p.inlineData&&p.inlineData.data)play(p.inlineData.data);
  if(sc.inputTranscription&&sc.inputTranscription.text)cap('k',sc.inputTranscription.text);
  if(sc.outputTranscription&&sc.outputTranscription.text)cap('t',sc.outputTranscription.text);
 };
 ws.onerror=()=>{};
 ws.onclose=e=>{if(live)st('انتهت المكالمة 👋 شكراً!');else st('ما قدرناش نوصلوا للأستاذ ('+e.code+(e.reason?' '+e.reason.slice(0,80):'')+')','err');cleanup()};
}
async function startMic(){
 const url=URL.createObjectURL(new Blob([WK],{type:'application/javascript'}));await inCtx.audioWorklet.addModule(url);
 srcN=inCtx.createMediaStreamSource(mic);node=new AudioWorkletNode(inCtx,'p');
 node.port.onmessage=e=>{if(muted||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(e.data),mimeType:'audio/pcm;rate=16000'}}}))};
 srcN.connect(node);
}
function tick(){const s=Math.max(0,Math.round((endAt-Date.now())/1e3));$('tm').textContent='⏱️ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)end()}
function end(){if(ws&&ws.readyState<2)ws.close();else cleanup()}
function cleanup(){live=false;clearInterval(timer);stopPlay();try{node&&node.disconnect();srcN&&srcN.disconnect()}catch(e){}
 if(mic)mic.getTracks().forEach(t=>t.stop());try{inCtx&&inCtx.close();setTimeout(()=>{try{outCtx&&outCtx.close()}catch(e){}},300)}catch(e){}
 mic=null;$('av').className='av';$('end').style.display='none';$('mute').style.display='none';$('go').style.display='';$('go').disabled=false;$('go').textContent='🎙️ مكالمة جديدة';$('tm').textContent=''}
$('back').onclick=e=>{e.preventDefault();end();if(window.parent!==window)parent.postMessage('nour-close',location.origin);else history.back()};
$('go').onclick=start;$('end').onclick=end;
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🎙️ رجّع الصوت':'🔇 كتم';st(muted?'الميكروفون مكتوم':'الأستاذ معاك… تكلّم 🎙️')};
</script>
<script>(function(){function s(t,q){try{parent.postMessage(q?{lbt:t,qq:q}:{lbt:t},'*')}catch(e){}}
var seen=new WeakSet();
function qinfo(b,cb){setTimeout(function(){try{var G=b.parentElement,opts=[].slice.call(G.children).filter(function(x){return x.classList.contains('opt')});if(opts.length<2)return cb(null);
 var p=G,qEl=null;for(var i=0;i<4&&p&&!qEl;i++){qEl=[].slice.call(p.children).filter(function(c){return !c.classList.contains('opt')&&!c.querySelector('.opt')&&!c.classList.contains('fb')&&!c.classList.contains('sc')&&c.textContent.trim().length>2})[0];if(!qEl)p=p.parentElement}
 if(!qEl||qEl.querySelector('canvas,svg,img,input,table'))return cb(null);
 var o=opts.map(function(x){return x.textContent.trim()}),r=-1,w=opts.indexOf(b);opts.forEach(function(x,i){if(x.classList.contains('ok'))r=i});
 cb({q:qEl.textContent.replace(/\s+/g,' ').trim().replace(/^\d+\)\s*/,'').slice(0,300),o:o,r:r,w:w})}catch(e){cb(null)}},60)}
new MutationObserver(function(ms){ms.forEach(function(m){
 if(m.type==='attributes'){var t=m.target,c=t.classList,o=' '+(m.oldValue||'')+' ';
  if((c.contains('ok')||c.contains('good'))&&!/ (ok|good) /.test(o)){if(c.contains('opt')&&!t.parentElement.querySelector('.opt.no'))qinfo(t,function(q){s('ok',q)});else s('ok')}
  if((c.contains('no')||c.contains('bad'))&&!/ (no|bad) /.test(o)){if(c.contains('opt'))qinfo(t,function(q){s('no',q)});else s('no')}}
 else m.addedNodes.forEach(function(n){if(n.nodeType===1&&n.tagName==='SPAN'&&!seen.has(n)){seen.add(n);if(n.classList.contains('ok'))s('ok');if(n.classList.contains('no'))s('no')}});
})}).observe(document.documentElement,{attributes:true,subtree:true,attributeOldValue:true,attributeFilter:['class'],childList:true});
document.addEventListener('click',function(){s('act')},true);})();</script>
</body></html>
