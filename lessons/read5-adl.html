<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>الأب العادل 🎁 – قراءة وكتابة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Noto Naskh Arabic","Amiri",Tahoma,serif;background:#F3F0FF;color:#2B2160;min-height:100vh}
.top{background:linear-gradient(135deg,#7048E8,#9775FA);color:#fff;padding:14px 16px 18px;border-radius:0 0 26px 26px;box-shadow:0 6px 18px #7048e855}
.top h1{margin:0;font-size:1.4rem;font-family:Cairo,Tahoma,sans-serif;font-weight:900}.top p{margin:2px 0 0;font-weight:700;opacity:.95;font-size:.9rem;font-family:Cairo,Tahoma,sans-serif}
.stars{display:inline-block;background:#fff3;border-radius:99px;padding:3px 12px;font-weight:900;margin-top:8px;font-family:Cairo,Tahoma,sans-serif}
.w{max-width:560px;margin:0 auto;padding:14px;font-family:Cairo,Tahoma,sans-serif}
.st{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 0 #ddd3ff;cursor:pointer;margin-bottom:12px;border:3px solid transparent}
.st:active{transform:scale(.97)}.st .ic{font-size:2.3rem;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#EDE7FF;border-radius:16px}
.st b{display:block;font-size:1.05rem}.st small{color:#6b5fa0;font-weight:700}.st .sv{margin-right:auto;font-size:1.05rem}
.st.next{border-color:#7048E8}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 0 #ddd3ff;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:10px}
.btn{border:0;border-radius:16px;padding:12px 18px;font-family:Cairo,Tahoma,sans-serif;font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 #0002}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}
.go{background:#7048E8;color:#fff}.ghost{background:#fff;color:#2B2160}.say{background:#FFE066;color:#5c4400}
.big{font-size:2.6rem;text-align:center}
.sent{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:1.75rem;line-height:2.4;font-weight:700;text-align:center}
.sent .wd{cursor:pointer;border-radius:8px;padding:0 3px;transition:background .2s}
.sent .wd.on{background:#FFE066}
.syl{display:flex;flex-direction:row;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.syl span{background:#EDE7FF;border-radius:12px;padding:6px 12px;font-family:"Noto Naskh Arabic",serif;font-size:1.8rem;font-weight:700;cursor:pointer;border:2px solid transparent}
.syl span.on{background:#FFE066;border-color:#f59f00}
.wbig{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:3rem;font-weight:700;text-align:center;margin:6px 0}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:3px solid #ddd3ff;border-radius:16px;padding:12px;font-size:1.25rem;font-weight:800;font-family:"Noto Naskh Arabic",Cairo,serif;color:#2B2160;cursor:pointer;text-align:right}
.opt.ok{background:#d3f9d8;border-color:#2f9e44}.opt.no{background:#ffe3e3;border-color:#e03131;animation:shk .35s}
.opts.three{grid-template-columns:1fr 1fr 1fr}.opts.three .opt{text-align:center;font-size:1.5rem}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex{background:#E7F5FF;border-radius:16px;padding:12px;font-weight:800;line-height:1.9;margin-top:12px;display:none}
.ex.on{display:block}
.build{min-height:70px;background:#FFF9DB;border:3px dashed #f59f00;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{background:#fff;border:3px solid #ddd3ff;border-radius:14px;padding:6px 12px;font-family:"Noto Naskh Arabic",serif;font-size:1.4rem;font-weight:700;cursor:pointer}
.build .chip{background:#FFE066;border-color:#f59f00}
.chip.no{animation:shk .35s;border-color:#e03131}
.q{font-weight:900;font-size:1.1rem;margin-bottom:8px;color:#5f3dc4}
.bar{height:12px;background:#ddd3ff;border-radius:9px;overflow:hidden;margin:0 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7048E8,#B197FC);transition:width .4s}
.fin{text-align:center;padding:20px 0}.fin .big{font-size:5rem}
.tip{background:#FFF4E6;border-radius:14px;padding:10px 12px;font-weight:800;margin-top:10px;font-size:.95rem}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
</style></head><body>
<div class="top"><h1>🎁 الأب العادل</h1><p>نقرا القصة، ونفهمها، ونكتب الأجوبة صح</p><span class="stars" id="tot">⭐ 0 من 15</span></div>
<div class="w" id="app"></div>
<canvas id="cf"></canvas>
<script>
const $=id=>document.getElementById(id),A=$('app');
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),SH=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
let P={};try{P=JSON.parse(localStorage.getItem('read5adl')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('read5adl',JSON.stringify(P))}catch(e){}};
const rep=t=>{try{parent.postMessage({lbt:t},'*')}catch(e){}};
/* sound */
let AC;const tone=(f,d=.12,t='sine',v=.08,w=0)=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+w;o.start(s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.stop(s+d+.02)}catch(e){}};
const yay=()=>{tone(660,.1,'triangle',.1);tone(880,.12,'triangle',.1,.09);tone(1320,.18,'triangle',.08,.18)},boo=()=>{tone(220,.18,'sawtooth',.05)};
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=[...Array(80)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*4,r:Math.random()*6,c:['#7048E8','#FFD43B','#20C997','#FF6B6B','#4DABF7'][R(0,4)]}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-4,-6,8,12);x.restore()});if(++t<130)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
/* voice */
let VO=null;const pickV=()=>{const vs=(speechSynthesis&&speechSynthesis.getVoices())||[];VO=vs.find(v=>/^ar/i.test(v.lang))||null};try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
function say(t,rate=.75,cb){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';if(VO)u.voice=VO;u.rate=rate;if(cb)u.onend=cb;speechSynthesis.speak(u)}catch(e){cb&&cb()}}
/* content (story retold in simple words) */
const STORY=[
 {e:'🚗🏠',t:'رَجَعَ الأَبُ مِنَ السَّفَرِ، فَفَرِحَ مُحَمَّدٌ وَإِبْرَاهِيمُ كَثِيرًا.'},
 {e:'🎁🎁',t:'أَحْضَرَ الأَبُ لَهُمَا هَدِيَّتَيْنِ مُتَشَابِهَتَيْنِ، لِأَنَّهُ يُحِبُّهُمَا مِثْلَ بَعْضٍ.'},
 {e:'😠🧸',t:'أَخَذَ إِبْرَاهِيمُ لُعْبَةَ أَخِيهِ، فَصَرَخَ مُحَمَّدٌ وَتَشَاجَرَا.'},
 {e:'🤗👨‍👦‍👦',t:'هَدَّأَ الأَبُ وَلَدَيْهِ، وَأَعْطَى كُلَّ وَاحِدٍ لُعْبَتَهُ.'},
 {e:'💛⚖️',t:'قَالَ الأَبُ: أَنَا لَا أُفَرِّقُ بَيْنَكُمَا، وَالرَّسُولُ ﷺ أَمَرَنَا بِالعَدْلِ.'}];
const WORDS=[
 ['اِنْدَفَعَ',['اِنْ','دَ','فَ','عَ'],'جرى بسرعة'],
 ['شَوْقٍ',['شَوْ','قٍ'],'يحب يشوفه بزاف'],
 ['حَقِيبَتَهُ',['حَ','قِي','بَ','تَ','هُ'],'الشنطة'],
 ['مُتَشَابِهَتَيْنِ',['مُ','تَ','شَا','بِ','هَ','تَيْ','نِ'],'زي بعض'],
 ['مُتَسَاوِيَةٍ',['مُ','تَ','سَا','وِ','يَ','ةٍ'],'نفس العدد'],
 ['يَتَفَحَّصُهَا',['يَ','تَ','فَحْ','حَ','صُ','هَا'],'يشوفها بالتفصيل'],
 ['اِنْقَضَّ',['اِنْ','قَضْ','ضَ'],'هجم بسرعة'],
 ['صُرَاخُ',['صُ','رَا','خُ'],'صوت عالي'],
 ['اِشْتَبَكَ',['اِشْ','تَ','بَ','كَ'],'تعاركوا'],
 ['تَهْدِئَتِهِمَا',['تَهْ','دِ','ئَ','تِ','هِ','مَا'],'يخليهم يهدوا'],
 ['بِعَطْفٍ',['بِ','عَطْ','فٍ'],'بحنان'],
 ['العَدْلِ',['الْ','عَدْ','لِ'],'ما يفرّقش بين الأولاد']];
const QUIZ=[
 ['منين رجع الأب؟',['من السفر ✈️','من المدرسة','من السوق'],0],
 ['شنو جاب الأب لولديه؟',['هديتين متشابهتين 🎁','هدية وحدة','فلوس'],0],
 ['مين خذا لعبة أخوه؟',['إبراهيم','محمد','الأب'],0],
 ['ليش تعاركوا الولدين؟',['لأن إبراهيم خذا لعبة أخوه','لأن الأب ما جابش هدايا','لأن اللعب انكسرت'],0],
 ['شنو قال الأب؟',['أنا لا أفرّق بينكما ⚖️','أنا نحب محمد أكثر','ما نجيبش هدايا مرة ثانية'],0],
 ['سلوك الأب كان...',['جميل وعادل 💛','ظالم','مش مهم'],0]];
const ANS=[
 {q:'كيف تعامل الأب مع ولديه؟',a:'تَعَامَلَ الأَبُ مَعَ وَلَدَيْهِ بِالعَدْلِ'},
 {q:'ما رأيك في سلوك الأب؟',a:'سُلُوكُهُ جَمِيلٌ لِأَنَّهُ يَعْدِلُ بَيْنَ أَبْنَائِهِ'},
 {q:'ما سبب خصومة الولدين؟',a:'سَبَبُ الخُصُومَةِ أَنَّ إِبْرَاهِيمَ أَخَذَ لُعْبَةَ أَخِيهِ'},
 {q:'كيف سيتصرف الطفلان بعد كلام أبيهما؟',a:'سَيَتَصَالَحُ الطِّفْلَانِ وَيَلْعَبَانِ مَعًا'}];
const SPELL=[['لُعْبَة',['لعبة','لعبه','لعبت'],0,'آخرها ة مربوطة لأنها اسم مؤنث'],['أَخِيهِ',['أخيه','أخيت','أخية'],0,'الضمير «هِ» يعني له، يتكتب هاء'],['إِبْرَاهِيم',['إبراهيم','أبراهيم','ابرهيم'],0,'الهمزة تحت الألف إ، وفيه ألف بعد الراء'],['العَدْل',['العدل','الادل','العدال'],0,'ال + عَدْل'],['هَدِيَّة',['هدية','هديه','هدييه'],0,'آخرها ة مربوطة'],['سُلُوك',['سلوك','سلك','سولوك'],0,'فيه واو بعد اللام'],['جَمِيل',['جميل','جمل','جاميل'],0,'فيه ياء بعد الميم'],['أَبْنَائِهِ',['أبنائه','ابناءه','أبنايه'],0,'الهمزة على نبرة ئ قبل الهاء']];
const LV=[{k:'story',ic:'📖',t:'اقرأ القصة',d:'اسمع، وبعدين اقرأ بصوتك'},{k:'words',ic:'🔤',t:'الكلمات الصعبة',d:'نقسّم الكلمة لقطع صغيرة'},{k:'quiz',ic:'🧩',t:'فهمت القصة؟',d:'6 أسئلة سريعة'},{k:'ans',ic:'✏️',t:'رتّب الجواب',d:'نبني جواب الامتحان كلمة كلمة'},{k:'spell',ic:'🎧',t:'تحدّي الإملاء',d:'اسمع واختار الكتابة الصح'}];
const tot=()=>LV.reduce((a,l)=>a+(P[l.k]||0),0);
function map(){$('tot').textContent='⭐ '+tot()+' من 15';const nx=LV.findIndex(l=>!P[l.k]);
 A.innerHTML='<div class="card" style="display:flex;gap:10px;align-items:center"><span style="font-size:2.6rem">🧑‍🏫</span><div style="font-weight:800">يا بطل! بكرة امتحانك، والليلة نتمرنوا مع بعض. امشي المحطات بالترتيب، وكل محطة تاخذ فيها نجوم ⭐</div></div>'+LV.map((l,i)=>'<div class="st'+(i===nx?' next':'')+'" data-i="'+i+'"><span class="ic">'+l.ic+'</span><div><b>'+(i+1)+'. '+l.t+'</b><small>'+l.d+'</small></div><span class="sv">'+('⭐'.repeat(P[l.k]||0)||'☆☆☆')+'</span></div>').join('')+(tot()>=13?'<div class="fin"><div class="big">🏆</div><b>جاهز للامتحان! بالتوفيق يا بطل 🌟</b></div>':'');
 A.querySelectorAll('.st').forEach(s=>s.onclick=()=>({story,words,quiz,ans,spell})[LV[+s.dataset.i].k]())}
const head=(l,i,n)=>'<div class="hd"><button class="btn ghost" id="bk" style="padding:7px 12px;font-size:.9rem">🗺️ رجوع</button><span>'+l.ic+' '+l.t+'</span><span>'+(i+1)+' / '+n+'</span></div><div class="bar"><i style="width:'+(i/n*100)+'%"></i></div>';
const bk=()=>{$('bk').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}map()}};
function finish(k,miss){const s=miss===0?3:miss<=2?2:1;P[k]=Math.max(P[k]||0,s);save();confetti();yay();
 A.innerHTML='<div class="fin"><div class="big">'+['','🙂','😃','🤩'][s]+'</div><h2>'+['','كمّلت!','ممتاز!','بطل!'][s]+'</h2><div style="font-size:2.4rem">'+'⭐'.repeat(s)+'☆'.repeat(3-s)+'</div><p style="font-weight:800">'+(s<3?'عاودها بدون أخطاء وخذ 3 نجوم 💪':'برافو عليك 👏')+'</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn ghost" id="ag">🔁 مرة ثانية</button><button class="btn go" id="mp">🗺️ المحطة الجاية</button></div></div>';
 $('ag').onclick=()=>({story,words,quiz,ans,spell})[k]();$('mp').onclick=map;$('tot').textContent='⭐ '+tot()+' من 15'}
/* 1 story */
function story(i=0){const l=LV[0],s=STORY[i];const ws=s.t.split(' ');
 A.innerHTML=head(l,i,STORY.length)+'<div class="card"><div class="big">'+s.e+'</div><div class="sent">'+ws.map((w,k)=>'<span class="wd" data-k="'+k+'">'+w+'</span>').join(' ')+'</div><div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="btn say" id="sy">🔊 اسمع الجملة</button></div><div class="tip">👆 اضغط على أي كلمة تسمعها لوحدها. وبعدين <b>اقرأ الجملة بصوتك</b> وصبعك تحت الكلمات.</div></div><button class="btn go" style="width:100%" id="nx">'+(i<STORY.length-1?'قريتها ✓ الجملة الجاية':'قريت القصة كاملة ✓')+'</button>';bk();
 const marks=[...A.querySelectorAll('.wd')];
 $('sy').onclick=()=>{let k=0;marks.forEach(m=>m.classList.remove('on'));const step=()=>{marks.forEach(m=>m.classList.remove('on'));if(k<marks.length){marks[k].classList.add('on');k++;setTimeout(step,Math.max(450,marks[k-1].textContent.length*95))}};say(s.t,.7);step()};
 marks.forEach(m=>m.onclick=()=>{marks.forEach(x=>x.classList.remove('on'));m.classList.add('on');say(m.textContent.replace(/[،.:]/g,''),.6)});
 $('nx').onclick=()=>{rep('ok');tone(700,.08,'triangle',.07);i<STORY.length-1?story(i+1):finish('story',0)}}
/* 2 words */
function words(i=0,miss=0){const l=LV[1],[w,syl,mean]=WORDS[i];let k=0;
 A.innerHTML=head(l,i,WORDS.length)+'<div class="card"><div class="wbig">'+w+'</div><div style="text-align:center;font-weight:800;color:#6b5fa0">معناها: '+mean+'</div><div class="tip">👆 اضغط القطع <b>بالترتيب من اليمين</b> وقول كل قطعة بصوتك</div><div class="syl" id="sy">'+syl.map((s,j)=>'<span data-j="'+j+'">'+s+'</span>').join('')+'</div><div style="text-align:center"><button class="btn say" id="hear">🔊 اسمع الكلمة</button></div></div><div class="ex" id="ex"></div>';bk();
 $('hear').onclick=()=>say(w,.55);
 A.querySelectorAll('#sy span').forEach(sp=>sp.onclick=()=>{const j=+sp.dataset.j;if(j===k){sp.classList.add('on');say(sp.textContent,.6);k++;if(k===syl.length){setTimeout(()=>{say(w,.55);$('ex').className='ex on';$('ex').innerHTML='✅ برافو! <span style="font-family:Noto Naskh Arabic,serif;font-size:1.4rem">'+syl.join(' – ')+' = '+w+'</span>';yay();rep('ok');setTimeout(()=>i<WORDS.length-1?words(i+1,miss):finish('words',miss),1900)},500)}}else{boo();miss++;rep('no');sp.style.animation='shk .35s';setTimeout(()=>sp.style.animation='',400)}})}
/* 3 quiz */
function quiz(i=0,miss=0){const l=LV[2],[q,o,r]=QUIZ[i];const order=SH(o.map((x,j)=>j));let tried=false;
 A.innerHTML=head(l,i,QUIZ.length)+'<div class="card"><div class="q">'+q+'</div><div class="opts">'+order.map(j=>'<button class="opt" data-j="'+j+'">'+o[j]+'</button>').join('')+'</div></div><div class="ex" id="ex"></div>';bk();
 A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.j===r){b.classList.add('ok');yay();rep('ok');setTimeout(()=>i<QUIZ.length-1?quiz(i+1,miss):finish('quiz',miss),900)}else{b.classList.add('no');boo();rep('no');if(!tried){miss++;tried=true}$('ex').className='ex on';$('ex').textContent='🤔 تذكّر القصة: '+STORY[[0,1,2,2,4,4][i]].t}})}
/* 4 build answers */
function ans(i=0,miss=0){const l=LV[3],x=ANS[i],ws=x.a.split(' ');let k=0;const pool=SH(ws.map((w,j)=>j));
 A.innerHTML=head(l,i,ANS.length)+'<div class="card"><div class="q">❓ '+x.q+'</div><div class="tip">👆 اضغط الكلمات <b>بالترتيب</b> باش تبني الجواب. ابدأ بكلمات من السؤال!</div><div class="build" id="bd"></div><div class="pool" id="pl">'+pool.map(j=>'<span class="chip" data-j="'+j+'">'+ws[j]+'</span>').join('')+'</div></div><div class="ex" id="ex"></div>';bk();
 A.querySelectorAll('#pl .chip').forEach(c=>c.onclick=()=>{const j=+c.dataset.j;if(ws[j]===ws[k]){$('bd').appendChild(c);c.onclick=null;tone(500+k*60,.07,'triangle',.06);k++;if(k===ws.length){yay();rep('ok');say(x.a,.7);$('ex').className='ex on';$('ex').innerHTML='✅ جواب كامل! <br><span style="font-family:Noto Naskh Arabic,serif;font-size:1.35rem">'+x.a+'.</span><br>✏️ <b>الحين اكتبه في كراستك وأنت تشوف.</b><div style="text-align:center;margin-top:8px"><button class="btn go" id="nx">كتبته ✓</button></div>';$('nx').onclick=()=>i<ANS.length-1?ans(i+1,miss):finish('ans',miss)}}else{boo();miss++;rep('no');c.classList.remove('no');void c.offsetWidth;c.classList.add('no')}})}
/* 5 spelling */
function spell(i=0,miss=0){const l=LV[4],[w,o,r,why]=SPELL[i];const order=SH(o.map((x,j)=>j));let tried=false;
