<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المراجعة السريعة – الكتاب الحي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--ink:#22223b;--pu:#7a4bc2;--pu2:#5a2fa0;--bg:#f5f2fb;--ok:#2f9e44;--no:#e03131;--or:#f08c2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);direction:rtl}
.mr{direction:rtl;unicode-bidi:isolate;display:inline-block;font-weight:800;white-space:nowrap}
.mo{unicode-bidi:isolate-override!important}.mo bdi{unicode-bidi:isolate;direction:rtl}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-weight:700;white-space:nowrap}
#app{max-width:760px;margin:0 auto;padding:10px 12px 90px}
.top{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.pill{display:flex;background:#fff;border-radius:99px;padding:4px;box-shadow:0 2px 10px rgba(90,47,160,.1)}
.pill a{padding:6px 14px;border-radius:99px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.9rem}
.pill a.on{background:var(--pu);color:#fff}
.xp{margin-inline-start:auto;background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;box-shadow:0 2px 10px rgba(90,47,160,.1)}
.hero{background:linear-gradient(150deg,#7a4bc2,#4c2a85);color:#fff;border-radius:26px;padding:20px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(76,42,133,.3);position:relative;overflow:hidden}
.hero:after{content:"⚡";position:absolute;left:-10px;bottom:-30px;font-size:8rem;opacity:.1}
.hero h1{margin:0;font-size:1.35rem}.hero p{margin:4px 0 0;opacity:.85;font-size:.9rem}
.ring{flex:0 0 86px;height:86px;position:relative}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.st{background:#fff;border-radius:20px;padding:14px;cursor:pointer;box-shadow:0 3px 14px rgba(90,47,160,.08);border:2px solid transparent;position:relative;transition:transform .15s}
.st:active{transform:scale(.97)}.st .ic{font-size:2rem}.st b{display:block;margin:4px 0 2px}.st small{color:#868e96;line-height:1.5;display:block}
.st.done{border-color:#b2f2bb}.st.done:after{content:"✓";position:absolute;top:10px;left:12px;background:var(--ok);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:.85rem}
.bar{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.bar button{border:0;background:#fff;border-radius:12px;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bar h2{margin:0;font-size:1.1rem}
.box{background:#fff;border-radius:22px;padding:16px;box-shadow:0 3px 16px rgba(90,47,160,.08);min-height:300px}
.cnt{color:#868e96;font-weight:700;font-size:.85rem;text-align:center;margin-bottom:10px}
.btn{border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.btn.go{background:linear-gradient(135deg,#7a4bc2,#5a2fa0);color:#fff;width:100%;margin-top:10px}
.btn.ok{background:#d3f9d8;color:#2b8a3e}.btn.re{background:#fff3bf;color:#a06000}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px}.row .btn{flex:1}
/* flip cards */
.flip{perspective:1000px;height:230px;cursor:pointer}
.fin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fin{transform:rotateY(180deg)}
.fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.front{background:linear-gradient(150deg,#f3ecff,#e5dbff);border:2px dashed #b197fc}
.back{background:linear-gradient(150deg,#ebfbee,#d3f9d8);transform:rotateY(180deg);border:2px solid #8ce99a}
.ft{font-size:1.5rem;font-weight:900;color:var(--pu2)}.ft2{font-size:1.05rem;line-height:1.9;font-weight:600}
.hint{font-size:.8rem;color:#9775fa;margin-bottom:8px}
/* sort */
.chip{background:linear-gradient(150deg,#fff9db,#fff3bf);border:2px solid #ffd43b;border-radius:18px;padding:18px;text-align:center;font-size:1.15rem;font-weight:800;margin:6px auto 16px;max-width:460px;transition:all .4s}
.chip.fly{transform:translateY(60px) scale(.4);opacity:0}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(5px)}}
.bins{display:grid;gap:8px}.bins.b2{grid-template-columns:1fr 1fr}.bins.b3{grid-template-columns:1fr 1fr 1fr}
.bin{border:2px solid #d0bfff;background:#f8f5ff;border-radius:16px;padding:16px 6px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;color:var(--pu2);min-height:70px}
.bin.hit{background:#d3f9d8;border-color:#40c057;color:#2b8a3e}.bin.miss{background:#ffe3e3;border-color:#fa5252;color:#c92a2a}
.sx{margin-top:12px;line-height:1.9;text-align:center}
/* triangle */
.tri{display:block;margin:0 auto;max-width:280px;width:100%}
.tri text{font-family:"Segoe UI",Arial,sans-serif;font-weight:800;cursor:pointer}
.tri .cv{fill:#22223b}
.lab{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.lab span{background:#f3f0ff;border-radius:10px;padding:4px 10px;font-size:.85rem}
.fx{text-align:center;font-size:1.6rem;margin:6px 0;min-height:44px;color:var(--pu2)}
.prob{background:#fff4e6;border-radius:16px;padding:12px;line-height:1.9;margin-top:10px}
.ans{display:flex;gap:8px;margin-top:8px;align-items:center}
.ans input{flex:1;min-width:0;border:2px solid #d0bfff;border-radius:12px;padding:10px;font:inherit;font-size:1.1rem;text-align:center;direction:ltr}
.ans .btn{padding:10px 16px;background:var(--pu);color:#fff}
.fb{margin-top:8px;line-height:1.9}.fb.ok{color:#2b8a3e}.fb.no{color:#c92a2a}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.dots i{width:12px;height:12px;border-radius:50%;background:#e9ecef}.dots i.on{background:var(--ok)}
canvas.cv{width:100%;display:block;border-radius:16px;background:#fbfaff;touch-action:manipulation}
/* options */
.opts{display:grid;gap:8px;margin-top:10px}
.opt{border:2px solid #e5dbff;background:#fff;border-radius:14px;padding:12px;font:inherit;font-size:1rem;text-align:right;cursor:pointer;font-weight:600}
.opt.ok{background:#d3f9d8;border-color:#40c057}.opt.no{background:#ffe3e3;border-color:#fa5252}
.q{font-size:1.1rem;font-weight:800;line-height:1.9}
.tbar{height:8px;background:#f1f3f5;border-radius:9px;overflow:hidden;margin:6px 0 10px}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#f08c2e,#e8590c);width:100%}
.streak{text-align:center;font-weight:900;color:#e8590c;min-height:24px}
.ex{background:#f8f9fa;border-radius:12px;padding:10px;margin-top:10px;line-height:1.9}
.fin0{text-align:center;padding:24px 8px}.fin0 .big{font-size:3.6rem}.fin0 h3{margin:8px 0}
.sheet{line-height:2}.sheet .law{background:#f8f5ff;border-radius:16px;padding:10px 14px;margin:8px 0;border-inline-start:5px solid var(--pu)}
.sheet .law b{color:var(--pu2)}.sheet table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.92rem}
.sheet td,.sheet th{border:1px solid #e5dbff;padding:6px;text-align:center}.sheet th{background:#f3f0ff}
.why{background:#f8f5ff;border-radius:18px;padding:16px}
.why .a{display:none;background:#ebfbee;border-radius:14px;padding:12px;margin-top:10px;line-height:1.9}
.why.on .a{display:block}
.cf{position:fixed;top:-40px;font-size:1.6rem;pointer-events:none;animation:fall 1.6s ease-in forwards;z-index:99}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.tag{display:inline-block;background:#e5dbff;color:var(--pu2);border-radius:8px;padding:0 8px;font-size:.8rem;font-weight:800}
</style></head><body><div id="app"></div>

 [[0,1,1,1,'قبل'],[1,P.a1,P.b1,P.c1,'بعد']].forEach(([row,a,b,d,t])=>{const Y=row?165:60,mid=330,half=Math.min(250,70*d);x.fillStyle='#868e96';x.fillText(t,40,Y);

 x.fillStyle='#868e96';x.font='19px Cairo,Arial';x.fillText('الطول ← الامتداد ، السُّمك ← مساحة المقطع',300,220)}

<div class=law><b>1) الشحنة الكهربائية</b><br>البروتون موجب، الإلكترون سالب، النيوترون متعادل. مقدار شحنة الإلكترون = شحنة البروتون = ${m('1.6×10⁻¹⁹ C')}<br>

 return{a,a1,b1,c1,q:'القوة بين شحنتين '+m('F')+'. ماذا تصبح إذا: '+part.join('، و')+'؟',w:'القوة تتناسب طرديًا مع '+m('q₁q₂')+' وعكسيًا مع '+m('R²')+':<br>'+m('F₂ = ('+fr(a1)+' × '+fr(b1)+' ÷ '+fr(c1)+'²) F = '+fmtF(a,'F'))}}},

stations:[
{k:'sheet',ic:'🗺️',t:'خريطة الفصل',d:'كل الفصل في صفحة واحدة',html:`
<div class=law><b>1) التيار الكهربائي</b><br>الكهرباء التيارية تدرس الشحنات المتحركة، والجلفانومتر يكشف مرور التيار.<br>التيار = معدل سريان الشحنة: ${m('I = Q / t')} بوحدة الأمبير ${m('A = C/s')}.<br>${m('1 mA = 10⁻³ A')} &nbsp; ${m('1 μA = 10⁻⁶ A')} &nbsp;· عدد الشحنات: ${m('Q = n e')}</div>
<div class=law><b>2) اتجاه التيار</b><table><tr><th></th><th>الاصطلاحي (الشحنات الموجبة)</th><th>الإلكتروني (الحقيقي)</th></tr><tr><td>خارج البطارية</td><td>من + إلى −</td><td>من − إلى +</td></tr><tr><td>داخل البطارية</td><td>من − إلى +</td><td>من + إلى −</td></tr></table>الاتجاهان متعاكسان دائمًا.</div>
<div class=law><b>3) الدوائر وأجهزة القياس</b><br><b>مغلقة:</b> مسار كامل والتيار يمر. <b>مفتوحة:</b> قطع في المسار فلا تيار. <b>قصيرة:</b> سلك يتجاوز الحِمل فيمر تيار كبير خطِر.<table><tr><th></th><th>الأميتر</th><th>الفولتميتر</th></tr><tr><td>يقيس</td><td>شدة التيار</td><td>فرق الجهد / القوة الدافعة</td></tr><tr><td>التوصيل</td><td>توالٍ</td><td>توازٍ</td></tr><tr><td>مقاومته</td><td>صغيرة جدًا</td><td>كبيرة جدًا</td></tr></table></div>
<div class=law><b>4) القوة الدافعة وفرق الجهد</b><br><b>القوة الدافعة:</b> طاقة غير كهربائية ⇐ كهربائية لكل كولوم داخل المصدر. <b>فرق الجهد:</b> طاقة كهربائية ⇐ غير كهربائية لكل كولوم بين نقطتين.<br>${m('V = W / Q')} والفولت = جول/كولوم. إذا أُهملت المقاومة الداخلية: القوة الدافعة = فرق الجهد بين القطبين.</div>
<div class=law><b>5) المقاومة وقانون أوم</b><br>${m('V = I R')} عند ثبوت درجة الحرارة. منحنى (V–I) خط مستقيم <b>ميله = R</b>. الأوم: مقاومة موصل يمر به ${m('1 A')} عندما يكون فرق الجهد ${m('1 V')}.<br>المقاومة تزيد بزيادة <b>درجة الحرارة</b> و<b>الطول</b>، وتقل بزيادة <b>مساحة المقطع</b>، وتعتمد على <b>نوع المادة</b>.</div>
<div class=law><b>6) المقاومة النوعية</b><br>${m('R = ρ L / A')} &nbsp;ووحدة ρ هي ${m('Ω·m')}. تعتمد على نوع المادة ودرجة حرارتها فقط؛ كلما صغرت كان الموصل أجود.<br>للمقارنة بين سلكين: ${m('R₂ = (ρ₂ L₂ A₁ / ρ₁ L₁ A₂) R₁')} — ومن نفس المادة تختصر ρ.</div>`},

let AC;function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const t=AC.currentTime;if(ok){o.type='sine';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.09)}else{o.type='square';o.frequency.setValueAtTime(200,t);o.frequency.setValueAtTime(150,t+.1)}g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.3)}catch(e){}}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

const near=(x,a)=>isFinite(x)&&Math.abs(x-a)<=Math.abs(a)*.02+1e-12;
function fmtN(v){if(v===0)return'0';const a=Math.abs(v);if(a>=1e5||a<1e-3){const e=Math.floor(Math.log10(a));let m=+(v/Math.pow(10,e)).toFixed(2);return m+'×10<sup>'+e+'</sup>'}return String(+v.toPrecision(4))}
function frac(f){for(let q=1;q<=64;q++){const p=f*q;if(Math.abs(p-Math.round(p))<1e-9)return[Math.round(p),q]}return[f,1]}
function fmtF(f,B){const[p,q]=frac(f);if(q===1)return p===1?B:p+B;if(p===1)return B+'/'+q;return'('+p+'/'+q+') '+B}

  $('y').onclick=()=>{got++;good();k++;draw()};$('n').onclick=()=>{L.push(it);k++;beep(0);draw()}}
 draw()};
/* 7) تحدي السرعة */
R.quiz=(s,b,done)=>{let L=shuf(s.items),k=0,sc=0,stk=0,best=0,wrong=[],tm,T0;const SEC=s.sec||30;
 function draw(){clearInterval(tm);if(k>=L.length){const p=sc/L.length,st=p>=.9?'⭐⭐⭐':p>=.7?'⭐⭐':p>=.5?'⭐':'';
   b.innerHTML=fin('نتيجتك '+sc+' من '+L.length+' '+st,`<p>أطول سلسلة صحيحة: 🔥 ${best}</p>${wrong.length?'<button class="btn re" id=rw>↺ أعد الأسئلة التي أخطأت فيها ('+wrong.length+')</button>':''}`);
   if(wrong.length)$('rw').onclick=()=>{L=shuf(wrong);wrong=[];k=0;sc=0;stk=0;draw()};if(p>=.5)done();else b.insertAdjacentHTML('beforeend','<p class=cnt>احصل على النصف على الأقل لتُحتسب المحطة ✓</p><button class="btn go" id=ag>حاول من جديد</button>'),$('ag').onclick=()=>{L=shuf(s.items);k=0;sc=0;stk=0;wrong=[];draw()};return}
  const it=L[k],ord=shuf(it.o.map((_,i)=>i));
  b.innerHTML=`<div class=cnt>سؤال ${k+1} من ${L.length} · ✓ ${sc}</div><div class=tbar><i id=tb></i></div><div class=streak>${stk>=2?'🔥 '+stk+' متتالية!':''}</div><div class=q>${it.q}</div><div class=opts>${ord.map(i=>`<button class=opt data-i=${i}>${it.o[i]}</button>`).join('')}</div><div id=ex></div>`;
  T0=Date.now();tm=setInterval(()=>{const f=1-(Date.now()-T0)/(SEC*1000);$('tb').style.width=Math.max(0,f*100)+'%';if(f<=0)ans(-1)},100);
  function ans(w){clearInterval(tm);if(b.dataset.lock)return;b.dataset.lock=1;const ok=w===0;
   b.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.i===0)x.classList.add('ok');else if(+x.dataset.i===w)x.classList.add('no')});
   const qq={q:it.q.replace(/<[^>]+>/g,''),o:ord.map(i=>it.o[i].replace(/<[^>]+>/g,'')),r:ord.indexOf(0),w:ord.indexOf(w)};
   if(ok){sc++;stk++;best=Math.max(best,stk);good(qq)}else{stk=0;wrong.push(it);bad(qq)}
   $('ex').innerHTML=`<div class=ex>${w<0?'⏰ انتهى الوقت! ':''}${ok?'✅ ':'❌ '}${it.e||''}</div><button class="btn go" id=nx>التالي ←</button>`;$('nx').onclick=()=>{delete b.dataset.lock;k++;draw()}}
  b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>ans(+x.dataset.i))}
 draw()};
/* أدوات رسم */
function cx(c){const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.font='bold 22px Cairo,Arial';x.direction='ltr';x.textAlign='center';x.textBaseline='middle';return x}
function arrow(x,x1,y1,x2,y2,col,w){x.strokeStyle=x.fillStyle=col;x.lineWidth=w||4;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();const a=Math.atan2(y2-y1,x2-x1),h=12;x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45));x.lineTo(x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45));x.closePath();x.fill()}
function ball(x,X,Y,r,q){const g=x.createRadialGradient(X-r/3,Y-r/3,2,X,Y,r);g.addColorStop(0,q>0?'#ffa8a8':'#a5d8ff');g.addColorStop(1,q>0?'#e03131':'#1971c2');x.fillStyle=g;x.beginPath();x.arc(X,Y,r,0,7);x.fill();x.fillStyle='#fff';x.font='bold '+Math.round(r*.9)+'px Arial';x.fillText(q>0?'+':'−',X,Y+1)}
function onTap(c,f){c.onclick=e=>{const r=c.getBoundingClientRect();f({x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height})}}
/* 8) محاكي نقطة التعادل */
R.neutral=(s,b,done)=>{const types=shuf(['same','same','opp','opp','eq','none']).slice(0,5);let k=0,sc=0;
 const D=100,X0=120,Y=120;// d = 100px ، q1 عند 120 و q2 عند 220
 function mk(t){const sg=pick([1,-1]);let a,c;
  if(t==='same'){[a,c]=pick([[1,4],[4,1],[1,9],[9,1],[4,9],[9,4],[2,8],[8,2]]);return[sg*a,sg*c]}
  if(t==='eq'){a=pick([2,3,5]);return[sg*a,sg*a]}
  if(t==='none'){a=pick([2,3,5]);return[sg*a,-sg*a]}
  [a,c]=pick([[1,4],[4,1],[1,9],[9,1],[2,9],[9,2],[2,8],[8,2]]);return[sg*a,-sg*c]}
 function sol(q1,q2){const a=Math.sqrt(Math.abs(q1)),c=Math.sqrt(Math.abs(q2));if(q1*q2>0)return a/(a+c);if(a===c)return null;return a<c?-a/(c-a):1+c/(a-c)}
 function E(q1,q2,u){const f=(q,p)=>{const r=u-p;if(Math.abs(r)<.02)return 0;return q*Math.sign(r)/(r*r)};return[f(q1,0),f(q2,1)]}
 function draw(){if(k>=types.length){b.innerHTML=fin('صيّاد نقاط التعادل: '+sc+'/'+types.length,'<p>القاعدة الذهبية: نقطة التعادل دائمًا أقرب إلى الشحنة <b>الأصغر</b> مقدارًا.</p>');done();return}
  const [q1,q2]=mk(types[k]),u0=sol(q1,q2),dd=30;
  b.innerHTML=`<div class=cnt>الحالة ${k+1} من ${types.length} · نقاطك ${sc}</div><div class=q>شحنتان: <span class=m>q₁ = ${q1>0?'+':'−'}${Math.abs(q1)} μC</span> و <span class=m>q₂ = ${q2>0?'+':'−'}${Math.abs(q2)} μC</span> والمسافة بينهما <span class=m>${dd} cm</span>.<br>👆 اضغط على الخط حيث تتوقع نقطة التعادل.</div><canvas class=cv id=cv width=640 height=230></canvas><button class="btn re" id=nn style="width:100%;margin-top:8px">🚫 لا توجد نقطة تعادل</button><div id=ex></div>`;
  const c=$('cv'),toX=u=>X0*2/2+u*D*2,s2=2;
  function scene(g){const x=cx(c);x.save();x.scale(s2,1);x.strokeStyle='#ced4da';x.lineWidth=2;x.beginPath();x.moveTo(5,Y);x.lineTo(315,Y);x.stroke();x.restore();
   for(let u=-1;u<=1.5;u+=.5){const X=(X0+u*D)*s2;x.fillStyle='#adb5bd';x.font='16px Arial';x.fillText((u*dd)+'',X,Y+52)}
   ball(x,X0*s2,Y,26,q1);ball(x,(X0+D)*s2,Y,26,q2);x.fillStyle='#22223b';x.font='bold 18px Arial';x.fillText('q₁ '+Math.abs(q1)+'μC',X0*s2,Y-44);x.fillText('q₂ '+Math.abs(q2)+'μC',(X0+D)*s2,Y-44);
   if(g!=null){const X=(X0+g*D)*s2,[e1,e2]=E(q1,q2,g),m=Math.max(Math.abs(e1),Math.abs(e2),1e-9),L=110;
    x.fillStyle='#f08c2e';x.beginPath();x.arc(X,Y,8,0,7);x.fill();
    if(Math.abs(e1)>1e-9)arrow(x,X,Y-14,X+Math.sign(e1)*Math.max(18,L*Math.abs(e1)/m),Y-14,'#e03131',5);
    if(Math.abs(e2)>1e-9)arrow(x,X,Y+16,X+Math.sign(e2)*Math.max(18,L*Math.abs(e2)/m),Y+16,'#1971c2',5)}
   return x}
  scene(null);
  function fin1(g,none){if(b.dataset.lock)return;b.dataset.lock=1;let ok;
   if(u0===null)ok=!!none;else ok=!none&&Math.abs(g-u0)<=.07;
   const x=scene(none?null:g);if(u0!==null){const X=(X0+u0*D)*s2;x.fillStyle='#2f9e44';x.font='30px Arial';x.fillText('★',X,Y-6);}
   const qq={q:'نقطة التعادل لشحنتين '+q1+' μC و '+q2+' μC',o:['حسب القاعدة'],r:0,w:ok?0:1};ok?(sc++,good(qq)):bad(qq);
   let w;if(u0===null)w='الشحنتان مختلفتان ومتساويتان: بينهما يتجه المجالان في نفس الاتجاه فيتجمعان، وخارجهما يكون مجال الشحنة الأقرب أكبر دائمًا ⇐ <b>لا توجد نقطة تعادل</b>.';
   else{const r1=Math.abs(u0*dd);w=(q1*q2>0?(q1===q2?'شحنتان متشابهتان ومتساويتان ⇐ النقطة <b>في المنتصف</b> تمامًا':'شحنتان متشابهتان ⇐ النقطة <b>بينهما</b>، أقرب إلى الأصغر'):'شحنتان مختلفتان ⇐ النقطة <b>خارجهما</b> على امتداد الخط، بجوار الأصغر')+'.<br>★ تقع على بعد <span class=m>'+(+r1.toFixed(1))+' cm</span> من q₁. '+(none?'':'<br>🔴 السهم الأحمر مجال q₁ و🔵 الأزرق مجال q₂ عند النقطة التي اخترتها: '+(ok?'متساويان ومتعاكسان تقريبًا ✓':'غير متساويين، لذلك المحصلة ليست صفرًا.'))}
   $('ex').innerHTML=`<div class=ex>${ok?'✅ أحسنت!':'❌ ليست هنا.'} ${w}</div><button class="btn go" id=nx>الحالة التالية ←</button>`;$('nx').onclick=()=>{delete b.dataset.lock;k++;draw()}}
  onTap(c,p=>{const u=(p.x/s2-X0)/D;if(u<-1.15||u>2.15)return;fin1(u,0)});$('nn').onclick=()=>fin1(null,1)}
 draw()};
/* 9) اقرأ المنحنى (قانون أوم) */
R.graph=(s,b,done)=>{let k=0,sc=0;const N=4;
 function draw(){if(k>=N){b.innerHTML=fin('قارئ المنحنيات: '+sc+'/'+N,'<p>الميل في منحنى (V–I) = المقاومة.</p>');done();return}
  const Rv=pick([2,4,5,8,10,20,25]),Ip=pick([.2,.4,.5,1,1.5,2]),Vp=Rv*Ip,ask=k%2?'I':'R';const Vq=ask==='I'?Rv*pick([.25,.5,.75].map(f=>f*Ip*2)):0;
  const Imax=Ip*2,Vmax=Rv*Imax,ans=ask==='R'?Rv:Vq/Rv;
  b.innerHTML=`<div class=cnt>منحنى ${k+1} من ${N} · نقاطك ${sc}</div><canvas class=cv id=cv width=640 height=360></canvas><div class=q style="margin-top:8px">${ask==='R'?'من المنحنى: احسب مقاومة الموصل <span class=m>R</span>':'من المنحنى: ما شدة التيار عندما يكون فرق الجهد <span class=m>'+(+Vq.toFixed(3))+' V</span>؟'}</div><div class=ans><input id=in inputmode=decimal placeholder="الناتج"><span class=m>${ask==='R'?'Ω':'A'}</span><button class=btn id=ck>تحقق</button></div><div id=fb class=fb></div>`;
  const x=cx($('cv')),L=80,Bt=300,W=520,H=260;x.strokeStyle='#e9ecef';x.lineWidth=1;
  for(let i=0;i<=4;i++){x.beginPath();x.moveTo(L+i*W/4,Bt);x.lineTo(L+i*W/4,Bt-H);x.stroke();x.beginPath();x.moveTo(L,Bt-i*H/4);x.lineTo(L+W,Bt-i*H/4);x.stroke()}
  x.fillStyle='#495057';x.font='17px Arial';for(let i=0;i<=4;i++){x.fillText(+(Imax*i/4).toFixed(3)+'',L+i*W/4,Bt+20);x.fillText(+(Vmax*i/4).toFixed(2)+'',L-34,Bt-i*H/4)}
  x.font='bold 18px Arial';x.fillText('I (A)',L+W-10,Bt+46);x.fillText('V (V)',L-30,Bt-H-24);
  arrow(x,L,Bt,L+W+20,Bt,'#495057',2);arrow(x,L,Bt,L,Bt-H-14,'#495057',2);
  x.strokeStyle='#7a4bc2';x.lineWidth=5;x.beginPath();x.moveTo(L,Bt);x.lineTo(L+W,Bt-H);x.stroke();
  const PX=L+W*Ip/Imax,PY=Bt-H*Vp/Vmax;x.setLineDash([6,6]);x.strokeStyle='#f08c2e';x.lineWidth=2;x.beginPath();x.moveTo(PX,Bt);x.lineTo(PX,PY);x.lineTo(L,PY);x.stroke();x.setLineDash([]);x.fillStyle='#f08c2e';x.beginPath();x.arc(PX,PY,8,0,7);x.fill();
  $('ck').onclick=()=>{const v=num($('in').value);if(!isFinite(v))return;$('ck').disabled=1;const ok=near(v,ans);ok?(sc++,good()):bad();
   $('fb').className='fb '+(ok?'ok':'no');$('fb').innerHTML=(ok?'✅ صحيح! ':'❌ ')+'الميل = <span class=m>ΔV/ΔI = '+(+Vp.toFixed(3))+' / '+Ip+' = '+Rv+' Ω</span>'+(ask==='I'?'<br>ثم <span class=m>I = V/R = '+(+Vq.toFixed(3))+' / '+Rv+' = '+(+ans.toFixed(4))+' A</span>':'')+'<button class="btn go" id=nx>التالي ←</button>';$('nx').onclick=()=>{k++;draw()}};
  $('in').onkeydown=e=>{if(e.key==='Enter')$('ck').click()}}
 draw()};
/* مسائل لا تنتهي */
R.gen=(s,b,done)=>{const N=s.n||6;let got=0,P;
 function prob(){P=pick(s.gens)();b.innerHTML=`<div class=cnt>حلّ ${N} مسائل صحيحة — أرقام جديدة كل مرة</div><div class=dots>${Array.from({length:N},(_,k)=>`<i class="${k<got?'on':''}"></i>`).join('')}</div><div class=prob><b>🎯 مسألة ${got+1}:</b> ${P.q}<div class=ans><input id=in inputmode=decimal placeholder="الناتج"><span class=m>${P.u||''}</span><button class=btn id=ck>تحقق</button></div><div id=fb class=fb></div></div>`;
  $('ck').onclick=()=>{const v=num($('in').value);if(!isFinite(v)){$('fb').className='fb no';$('fb').textContent='اكتب رقمًا';return}
   if(near(v,P.a)){got++;good();$('fb').className='fb ok';$('fb').innerHTML='✅ صحيح! '+P.w;$('ck').disabled=1;setTimeout(()=>{if(got<N)prob();else{b.innerHTML=fin('حللت '+N+' مسائل! 🧮');done()}},1600)}
   else{bad({q:P.q.replace(/<[^>]+>/g,''),o:[String(P.a),String(v)],r:0,w:1});$('fb').className='fb no';$('fb').innerHTML='❌ ليس بعد. الحل: '+P.w+'<br><button class="btn re" id=nx2>مسألة أخرى ↺</button>';$('nx2').onclick=prob}};
  $('in').onkeydown=e=>{if(e.key==='Enter')$('ck').click()}}
 prob()};
